<header class="header">
  <style>
    @media (min-width: 901px) {
      .header .header-row {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .header .brand {
        flex: 0 0 auto;
      }

      .header .nav-shell {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: max-content;
        max-width: calc(100% - 520px);
      }

      .header .header-nav,
      .header .nav-menu {
        justify-content: center;
      }

      .header .header-ctas {
        flex: 0 0 auto;
        margin-left: auto;
      }
    }

    @media (min-width: 901px) and (max-width: 1120px) {
      .header .nav-shell {
        position: static;
        transform: none;
        width: auto;
        max-width: none;
        margin: 0 auto;
      }

      .header .header-row {
        gap: 18px;
      }

      .header .nav-menu {
        gap: 12px;
      }

      .header .nav-link {
        font-size: .86rem;
      }
    }
  </style>

  <div class="container header-row">

    <a class="brand" href="/" aria-label="HydroSeal home">
      <img
        src="/assets/hero/Hydrosealpaversealing.png"
        alt="HydroSeal"
        class="brand-logo"
        loading="eager"
      />
    </a>

    <div class="nav-shell">

      <button
        class="nav-toggle"
        type="button"
        aria-controls="navMenu"
        aria-expanded="false"
        aria-label="Open menu"
      >
        <span class="nav-toggle-bars" aria-hidden="true"></span>
      </button>

      <nav class="nav header-nav" aria-label="Primary">
        <div class="nav-menu" id="navMenu">

          <div class="nav-group">
            <button class="nav-link nav-parent" type="button" aria-expanded="false">
              Paver Sealing
            </button>
            <div class="dropdown" role="menu" aria-label="Paver Sealing">
              <a role="menuitem" href="/paver-sealing/driveways">Driveways</a>
              <a role="menuitem" href="/paver-sealing/pool-decks">Pool Decks</a>
              <a role="menuitem" href="/paver-sealing/travertine-sealing">Travertine Sealing</a>
            </div>
          </div>

          <div class="nav-group">
            <button class="nav-link nav-parent" type="button" aria-expanded="false">
              Service Areas
            </button>
            <div class="dropdown" role="menu" aria-label="Service Areas">
              <a role="menuitem" href="/service-areas/jacksonville">Jacksonville</a>
              <a role="menuitem" href="/service-areas/st-johns-county">St. Johns County</a>
              <a role="menuitem" href="/service-areas/clay-county">Clay County</a>
            </div>
          </div>

          <a class="nav-link" href="/care-program">Care Program</a>
          <a class="nav-link" href="/warranty">Warranty</a>

          <div class="nav-mobile-ctas" role="presentation">
            <a class="btn btn-ghost" href="tel:+19045375000">Call 904.537.5000</a>
            <a class="btn btn-primary" href="/get-a-quote">Request a Quote</a>
          </div>

        </div>
      </nav>

      <button class="nav-overlay" type="button" hidden aria-label="Close menu"></button>
    </div>

    <div class="header-ctas">
      <a class="btn btn-ghost" href="tel:+19045375000">Call 904.537.5000</a>
      <a class="btn btn-primary" href="/get-a-quote">Request a Quote</a>
    </div>

  </div>
</header>
