name: Standardize site footers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/standardize-site-footers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrate every real page to the shared footer
        shell: python
        run: |
          from pathlib import Path
          import re

          footer_placeholder = '<footer data-include="/partials/footer.html"></footer>'
          include_script = '<script src="/assets/js/include.js" defer></script>'
          footer_re = re.compile(r'<footer\b[^>]*>.*?</footer>', re.I | re.S)
          changed=[]

          # 1) Every real HTML page uses the exact same shared footer component.
          for p in sorted(Path('.').rglob('*.html')):
            if '.git' in p.parts or (p.parts and p.parts[0] == 'partials'):
              continue
            text=p.read_text(encoding='utf-8',errors='ignore')
            old=text
            if footer_re.search(text):
              text=footer_re.sub(footer_placeholder, text, count=1)
            elif '</body>' in text.lower():
              idx=text.lower().rfind('</body>')
              text=text[:idx] + footer_placeholder + '\n' + text[idx:]

            if '/assets/js/include.js' not in text and '</body>' in text.lower():
              idx=text.lower().rfind('</body>')
              text=text[:idx] + include_script + '\n' + text[idx:]

            if text != old:
              p.write_text(text,encoding='utf-8')
              changed.append(str(p))

          # 2) Shared footer always loads the canonical footer stylesheet LAST,
          # after page-specific CSS, so page typography cannot leak into it.
          footer=Path('partials/footer.html')
          text=footer.read_text(encoding='utf-8')
          link='<link rel="stylesheet" href="/site-footer.css?v=20260912-standardized">\n'
          text=re.sub(r'<link[^>]+href=["\']/site-footer\.css[^>]*>\s*','',text,flags=re.I)
          marker='<footer class="site-footer">'
          if marker in text:
            text=text.replace(marker,link+marker,1)
          footer.write_text(text,encoding='utf-8')

          # 3) Disable old footer rules before the shared partial is inserted.
          inc=Path('assets/js/include.js')
          text=inc.read_text(encoding='utf-8')
          anchor='  window.__hs_includes_ran = true;\n'
          addition='''  window.__hs_includes_ran = true;\n\n  // Every real page now uses the same shared footer. Mark the page before\n  // the footer is inserted so legacy page CSS cannot style it differently.\n  if (document.querySelector('[data-include="/partials/footer.html"], footer.site-footer')) {\n    document.body.classList.add("shared-footer-page");\n  }\n'''
          if 'Every real page now uses the same shared footer.' not in text:
            text=text.replace(anchor,addition,1)
          text=re.sub(r'\n    // Learning Center pages use the shared footer without the brand/description\n    // block so Contact remains aligned with the other footer columns\.\n    if \(document\.body\.classList\.contains\("page-learning-center"\)\) \{\n      document\.querySelectorAll\("footer \.footer-brand"\)\.forEach\(\(brand\) => brand\.remove\(\)\);\n    \}\n','\n',text)
          inc.write_text(text,encoding='utf-8')

          # 4) One canonical stylesheet, copied to both historical paths so any
          # old direct reference renders identically while pages are cached.
          css='''/* HydroSeal canonical sitewide footer.\n   This file intentionally isolates footer typography/layout from page CSS. */\n.site-footer,\n.site-footer *{box-sizing:border-box}\n.site-footer{\n  display:block!important;\n  width:100%!important;\n  max-width:none!important;\n  margin:0!important;\n  padding:58px 0 24px!important;\n  border:0!important;\n  background:#0b2d4a!important;\n  color:#d7e5ec!important;\n  font-family:Arial,Helvetica,sans-serif!important;\n  font-size:16px!important;\n  font-style:normal!important;\n  text-align:left!important;\n}\n.site-footer .site-footer__inner{\n  display:block!important;\n  width:min(1180px,calc(100% - 40px))!important;\n  max-width:none!important;\n  margin:0 auto!important;\n  padding:0!important;\n}\n.site-footer .footer-grid{\n  display:grid!important;\n  grid-template-columns:1.45fr 1fr .9fr 1.25fr .8fr 1fr!important;\n  gap:30px!important;\n  align-items:start!important;\n}\n.site-footer .footer-grid>div,\nbody .site-footer .footer-service-areas,\nbody .site-footer .footer-brand{display:block!important;visibility:visible!important;opacity:1!important}\n.site-footer .footer-logo{\n  display:block!important;\n  width:190px!important;\n  max-width:190px!important;\n  height:auto!important;\n  margin:0 0 18px!important;\n  object-fit:contain!important;\n  filter:none!important;\n}\n.site-footer .footer-copy{\n  display:block!important;\n  max-width:300px!important;\n  margin:0!important;\n  color:#b9ccd6!important;\n  font-family:Arial,Helvetica,sans-serif!important;\n  font-size:14px!important;\n  font-weight:400!important;\n  line-height:1.7!important;\n  letter-spacing:0!important;\n  text-transform:none!important;\n}\n.site-footer .footer-title{\n  display:block!important;\n  margin:0 0 14px!important;\n  color:#fff!important;\n  font-family:Arial,Helvetica,sans-serif!important;\n  font-size:14px!important;\n  font-weight:900!important;\n  line-height:1.25!important;\n  letter-spacing:1px!important;\n  text-transform:uppercase!important;\n}\n.site-footer .footer-links{\n  display:flex!important;\n  flex-direction:column!important;\n  gap:10px!important;\n  margin:0!important;\n  padding:0!important;\n}\n.site-footer .footer-links a,\n.site-footer .footer-meta,\n.site-footer .footer-meta a,\n.site-footer .footer-meta span,\n.site-footer .footer-sitemap-link{\n  color:#d7e5ec!important;\n  font-family:Arial,Helvetica,sans-serif!important;\n  font-size:13px!important;\n  font-weight:400!important;\n  line-height:1.45!important;\n  letter-spacing:0!important;\n  text-transform:none!important;\n}\n.site-footer .footer-links a,\n.site-footer .footer-meta a,\n.site-footer .footer-sitemap-link{display:block!important;text-decoration:none!important}\n.site-footer .footer-links a:hover,\n.site-footer .footer-meta a:hover,\n.site-footer .footer-sitemap-link:hover{color:#39bfea!important;text-decoration:none!important}\n.site-footer .footer-meta{\n  display:flex!important;\n  flex-direction:column!important;\n  gap:12px!important;\n  margin:0!important;\n}\n.site-footer .footer-meta strong{\n  color:#fff!important;\n  font-family:Arial,Helvetica,sans-serif!important;\n  font-size:13px!important;\n  font-weight:900!important;\n  line-height:1.45!important;\n}\n.site-footer .footer-hours{display:flex!important;flex-direction:column!important;gap:2px!important}\n.site-footer .footer-bottom{\n  display:flex!important;\n  justify-content:space-between!important;\n  align-items:center!important;\n  gap:20px!important;\n  margin:38px 0 0!important;\n  padding:20px 0 0!important;\n  border-top:1px solid rgba(255,255,255,.14)!important;\n  color:#a9bec9!important;\n  font-family:Arial,Helvetica,sans-serif!important;\n  font-size:12px!important;\n  font-weight:400!important;\n  line-height:1.45!important;\n}\n.mobile-contactbar{display:none}\n@media(max-width:1100px){\n  .site-footer .footer-grid{grid-template-columns:repeat(3,1fr)!important}\n}\n@media(max-width:700px){\n  .site-footer{padding:48px 0 84px!important}\n  .site-footer .site-footer__inner{width:calc(100% - 32px)!important}\n  .site-footer .footer-grid{grid-template-columns:1fr 1fr!important;gap:28px 22px!important}\n  .site-footer .footer-brand{grid-column:1/-1!important}\n  .site-footer .footer-bottom{align-items:flex-start!important;flex-direction:column!important}\n  .mobile-contactbar{position:fixed;right:0;bottom:0;left:0;z-index:50;display:grid;grid-template-columns:1fr 1fr;background:#0b2d4a;border-top:1px solid rgba(255,255,255,.15)}\n  .mobile-callbar-btn{padding:16px;color:#fff;font:900 14px/1.2 Arial,Helvetica,sans-serif;text-align:center;text-decoration:none}\n  .mobile-callbar-btn+.mobile-callbar-btn{border-left:1px solid rgba(255,255,255,.15)}\n}\n@media(max-width:480px){\n  .site-footer .footer-grid{grid-template-columns:1fr!important}\n  .site-footer .footer-brand{grid-column:auto!important}\n}\n'''
          Path('site-footer.css').write_text(css,encoding='utf-8')
          Path('assets/css/site-footer.css').write_text(css,encoding='utf-8')

          print(f'Migrated/updated {len(changed)} HTML pages:')
          for x in changed: print(x)

      - name: Verify every real HTML page uses shared footer
        shell: python
        run: |
          from pathlib import Path
          failures=[]; total=0
          for p in sorted(Path('.').rglob('*.html')):
            if '.git' in p.parts or (p.parts and p.parts[0]=='partials'):
              continue
            total+=1
            t=p.read_text(encoding='utf-8',errors='ignore')
            if 'data-include="/partials/footer.html"' not in t or '/assets/js/include.js' not in t:
              failures.append(str(p))
          print('REAL_HTML_PAGES',total)
          print('FAILURES',len(failures))
          for x in failures: print(x)
          if failures: raise SystemExit(1)

      - name: Commit standardized footer system
        shell: bash
        run: |
          git config user.name "HydroSeal Site Automation"
          git config user.email "site-automation@users.noreply.github.com"
          git add '*.html' '**/*.html' site-footer.css assets/css/site-footer.css assets/js/include.js partials/footer.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No footer changes needed."
            exit 0
          fi
          git commit -m "Standardize shared footer across all site pages"
          git push origin HEAD:main
