name: Rebuild Jacksonville child pages v3

on:
  push:
    paths:
      - 'tools/rebuild-jacksonville-child-pages-v3.py'
      - '.github/workflows/rebuild-jacksonville-child-pages-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild Jacksonville child pages
        run: |
          python tools/rebuild-jacksonville-child-pages-v3.py
          sed -i 's/[[:space:]]\+$//' service-areas/jacksonville/jacksonville-beach.html service-areas/jacksonville/mandarin.html service-areas/jacksonville/southside.html
          git diff --check
      - name: Commit rebuilt child pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-areas/jacksonville/jacksonville-beach.html service-areas/jacksonville/mandarin.html service-areas/jacksonville/southside.html
          git diff --cached --check
          git commit -m "Rebuild Jacksonville child location pages" || exit 0
          git push
