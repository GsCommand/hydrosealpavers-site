name: One-time remove Bing UET

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-remove-bing-uet.yml"

permissions:
  contents: write

jobs:
  remove-bing-uet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove obsolete Bing UET tracking and verify Google analytics remains
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          html_files = sorted(Path('.').rglob('*.html'))
          js_files = sorted(Path('.').rglob('*.js'))
          changed = []
          removed_blocks = 0

          script_re = re.compile(r'<script\b[^>]*>.*?</script>', re.I | re.S)

          for path in html_files:
              original = path.read_text(encoding='utf-8')

              def repl(match):
                  global removed_blocks
                  block = match.group(0)
                  low = block.lower()
                  if ('bat.bing.net' in low or '97237409' in low or 'new uet(' in low) and ('uetq' in low or 'bing' in low or '97237409' in low):
                      removed_blocks += 1
                      return ''
                  return block

              text = script_re.sub(repl, original)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          # Verify no executable/source Bing UET references remain anywhere in HTML/JS.
          violations = []
          needles = ('bat.bing.net', '97237409', 'new UET(', 'uetq')
          for path in html_files + js_files:
              text = path.read_text(encoding='utf-8', errors='ignore')
              for needle in needles:
                  if needle.lower() in text.lower():
                      violations.append(f'{path}: still contains {needle}')

          # Preserve Google Analytics / Ads instrumentation.
          home = Path('index.html').read_text(encoding='utf-8')
          required = ('G-SXWZ2Z96S9', 'AW-17972657888', 'www.googletagmanager.com/gtag/js')
          for needle in required:
              if needle not in home:
                  violations.append(f'index.html: required Google analytics/ads tag missing: {needle}')

          analytics = Path('assets/js/analytics.js').read_text(encoding='utf-8')
          if 'window.gtag' not in analytics or 'click_to_call' not in analytics or 'request_quote_click' not in analytics:
              violations.append('assets/js/analytics.js: Google event tracking hooks were altered or missing')

          print(f'HTML files scanned: {len(html_files)}')
          print(f'HTML files changed: {len(changed)}')
          print(f'Bing UET script blocks removed: {removed_blocks}')
          for item in changed:
              print(' changed:', item)

          if violations:
              print('VIOLATIONS:')
              for item in violations:
                  print(' -', item)
              raise SystemExit(1)
          PY

      - name: Commit Bing UET removal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html' '*.js'
          if git diff --cached --quiet; then
            echo "No Bing UET changes needed."
            exit 0
          fi
          git commit -m "Remove obsolete Bing UET tracking sitewide"
          git push
