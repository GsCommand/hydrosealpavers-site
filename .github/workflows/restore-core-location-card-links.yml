name: Restore core location card links

on:
  push:
    paths:
      - 'tools/restore-core-location-card-links.py'
      - '.github/workflows/restore-core-location-card-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and verify core location cards
        run: |
          python tools/restore-core-location-card-links.py
          sed -i 's/[[:space:]]\+$//' service-areas/index.html service-areas/jacksonville/index.html
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-areas/index.html service-areas/jacksonville/index.html
          git diff --cached --check
          git commit -m "Restore core service area card links" || exit 0
          git push
