name: Center Learning Center CTA pills
on:
  push:
    paths:
      - '.github/workflows/center-learning-center-cta-pills.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Center CTA pill row
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/css/learning-center.css')
          s = p.read_text(encoding='utf-8')
          rule = '''\n/* Center Learning Center CTA action pills */\n.page-learning-center .blog-post__cta .hs-cta-actions{\n  justify-content:center!important;\n  text-align:center!important;\n}\n'''
          if '/* Center Learning Center CTA action pills */' not in s:
              s += rule
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/learning-center.css
          git commit -m "Center Learning Center CTA pills" || exit 0
          git push
