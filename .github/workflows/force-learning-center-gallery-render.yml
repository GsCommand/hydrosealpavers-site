name: Force Learning Center gallery render
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use direct current Elfsight platform script
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = [
              Path('learning-center/surfaces/what-is-the-best-sand-for-paver-joints-in-florida/index.html'),
              Path('learning-center/travertine/should-you-seal-travertine-pool-decks-in-florida/index.html'),
          ]
          app = '<div class="elfsight-app-bfab489f-7fca-4f05-ba5a-d92616b76b26" data-elfsight-app-lazy></div>'
          script = '<script src="https://static.elfsight.com/platform/platform.js" async></script>\n'
          for p in pages:
              s = p.read_text(encoding='utf-8')
              if app not in s:
                  raise SystemExit(f'Gallery app missing from {p}')
              # Remove either legacy/current duplicate immediately preceding the gallery.
              s = s.replace('<script src="https://elfsightcdn.com/platform.js" async></script>\n' + app, app)
              s = s.replace('<script src="https://static.elfsight.com/platform/platform.js" async></script>\n' + app, app)
              s = s.replace(app, script + app, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning-center/surfaces/what-is-the-best-sand-for-paver-joints-in-florida/index.html learning-center/travertine/should-you-seal-travertine-pool-decks-in-florida/index.html
          git diff --cached --quiet || git commit -m "Use direct Elfsight platform on Learning Center galleries"
          git push
