name: Fix mobile image loading order

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-image-loading-order.yml'

permissions:
  contents: write

jobs:
  fix-mobile-image-loading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch mobile Elfsight loading
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/js/third-party-loader.js')
          s = p.read_text()
          old_margin = "      }, { rootMargin: '300px 0px' });"
          new_margin = "      }, { rootMargin: window.matchMedia('(max-width:650px)').matches ? '0px 0px' : '300px 0px' });"
          if old_margin not in s:
              raise SystemExit('rootMargin marker not found')
          s = s.replace(old_margin, new_margin, 1)
          old_events = "  ['pointerdown', 'touchstart', 'scroll'].forEach((eventName) => {\n    window.addEventListener(eventName, loadElfsight, { once: true, passive: true });\n  });"
          new_events = "  // Desktop keeps the early interaction warm-up. Mobile waits for the widget to reach the viewport.\n  if (!window.matchMedia('(max-width:650px)').matches) {\n    ['pointerdown', 'touchstart', 'scroll'].forEach((eventName) => {\n      window.addEventListener(eventName, loadElfsight, { once: true, passive: true });\n    });\n  }"
          if old_events not in s:
              raise SystemExit('interaction marker not found')
          s = s.replace(old_events, new_events, 1)
          p.write_text(s)
          PY

      - name: Validate patch
        run: |
          grep -F "matches ? '0px 0px' : '300px 0px'" assets/js/third-party-loader.js
          grep -F "Mobile waits for the widget to reach the viewport" assets/js/third-party-loader.js

      - name: Commit fix
        run: |
          git config user.name "HydroSeal Site Automation"
          git config user.email "site-automation@users.noreply.github.com"
          git add assets/js/third-party-loader.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Delay mobile gallery loading until visible"
          git push origin HEAD:main
