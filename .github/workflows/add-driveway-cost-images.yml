name: Add driveway cost article images
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert side-by-side driveway images
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('learning-center/surfaces/driveway-paver-sealing-cost-per-square-foot/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<section><h2>Pricing reference and limitations</h2>'
          block = '''<div class="hs-driveway-cost-image-grid" style="display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:14px!important;margin:28px 0 32px!important">
<figure style="display:block!important;margin:0!important"><img src="/assets/hero/ponte-vedra-driveway-before-after.webp" alt="Ponte Vedra driveway before and after paver restoration and sealing" loading="lazy" style="display:block!important;width:100%!important;height:100%!important;aspect-ratio:4/3!important;object-fit:cover!important;border-radius:18px!important"></figure>
<figure style="display:block!important;margin:0!important"><img src="/assets/hero/driveway-before-after-hydroseal.webp" alt="HydroSeal driveway before and after paver cleaning and sealing" loading="lazy" style="display:block!important;width:100%!important;height:100%!important;aspect-ratio:4/3!important;object-fit:cover!important;border-radius:18px!important"></figure>
</div>
<style>@media(max-width:640px){.hs-driveway-cost-image-grid{grid-template-columns:1fr!important}}</style>
'''
          if marker not in s:
              raise SystemExit('Target heading not found')
          if 'hs-driveway-cost-image-grid' not in s:
              s = s.replace(marker, block + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning-center/surfaces/driveway-paver-sealing-cost-per-square-foot/index.html
          git diff --cached --quiet || git commit -m "Add driveway before-and-after images to cost guide"
          git push
# trigger
