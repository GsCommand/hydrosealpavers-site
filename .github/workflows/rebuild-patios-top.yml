name: Rebuild patios top
on:
  push:
    paths:
      - '.github/workflows/rebuild-patios-top.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild top of patios and walkways page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('paver-sealing/patios-walkways.html')
          s=p.read_text()

          css='''\n  <link rel="stylesheet" href="/assets/css/modern-header.css?v=20260807-2" />\n  <style id="patio-service-redesign">\n    body.page-patios-walkways>.hs-modern-header{position:absolute;top:16px;left:0;right:0;z-index:1000;padding:0;font-family:Arial,Helvetica,sans-serif;background:transparent}\n    .patio-service-hero{position:relative;min-height:760px;overflow:hidden;background:#0b2d4a;color:#fff}\n    .patio-service-hero__image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;max-width:none}\n    .patio-service-hero__grid{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,.75fr);gap:38px;align-items:center;width:min(1180px,calc(100% - 40px));margin:auto;padding-top:170px;padding-bottom:64px}\n    .patio-service-hero__glass{padding:42px;border:1px solid rgba(255,255,255,.10);border-radius:42px;background:rgba(5,32,51,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}\n    .patio-service-hero__eyebrow{display:inline-flex;align-items:center;margin:0;padding:10px 14px;border:1px solid rgba(255,255,255,.22);border-radius:30px;font-size:12px;line-height:1.2;font-weight:900;letter-spacing:2.4px;text-transform:uppercase}\n    .patio-service-hero__eyebrow:before{content:"";width:8px;height:8px;margin-right:9px;border-radius:50%;background:#39bfea;box-shadow:0 0 12px #39bfea}\n    .patio-service-hero h1{max-width:760px;margin:22px 0 15px;color:#fff;font-family:"Arial Black",Arial,sans-serif;font-size:clamp(46px,4.8vw,66px);line-height:.97;letter-spacing:-1.5px;text-transform:uppercase}\n    .patio-service-hero__subhead{margin:0;color:#aee9fb;font-size:21px;line-height:1.2;font-weight:900;text-transform:uppercase}\n    .patio-service-hero__copy{margin:16px 0 0;color:#e7f1f5;font-size:17px;line-height:1.55}\n    .patio-service-hero__actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}\n    .patio-service-hero__actions .btn{border-radius:30px;padding:17px 24px;font-size:13px;font-weight:950;letter-spacing:1px;text-transform:uppercase}\n    .patio-service-hero__actions .btn-primary{background:#39bfea;color:#fff;box-shadow:0 12px 28px rgba(57,191,234,.32)}\n    .patio-service-hero__actions .btn-ghost{border:0;background:#fff;color:#0b2d4a}\n    .patio-service-proof{display:flex;min-width:0;flex-direction:column;gap:15px;margin-top:24px}\n    .patio-service-proof__card{padding:28px;border-radius:30px;background:rgba(255,255,255,.96);color:#0b1220}\n    .patio-service-proof__google{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid rgba(15,23,42,.12);border-radius:999px;background:#fff;font-size:11px;font-weight:800;color:#5f6368}\n    .patio-service-proof__stars{margin-top:8px;color:#ffb000;font-size:24px;letter-spacing:2px}\n    .patio-service-proof__card h3{margin:14px 0;font-family:"Arial Black",Arial,sans-serif;font-size:29px;line-height:1.02}\n    .patio-service-proof__card p{margin:0 0 16px;color:#536475;font-size:15px;line-height:1.5;font-weight:700}\n    .patio-service-proof__card a{font-size:12px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase}\n    .patio-service-proof__cert{padding:20px 22px;border-radius:24px;background:rgba(15,110,168,.94);color:#fff;text-align:center;font-size:15px;font-weight:900}\n    .patio-service-features{position:relative;z-index:4;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(1180px,calc(100% - 40px));margin:-23px auto 0;padding:17px;border-radius:30px;background:#f0f5f7}\n    .patio-service-features a{display:block;height:100%;border-radius:20px;text-decoration:none;color:inherit;outline:none}\n    .patio-service-features article{height:100%;padding:20px;border:1px solid #dce5ea;border-radius:20px;background:#fff;transition:background .2s ease,border-color .2s ease,transform .2s ease,box-shadow .2s ease}\n    .patio-service-features a:hover article,.patio-service-features a:focus-visible article{background:rgba(57,191,234,.20);border-color:rgba(57,191,234,.65);transform:translateY(-2px);box-shadow:0 12px 28px rgba(15,110,168,.13)}\n    .patio-service-features h3{margin:0 0 5px;color:#0b2d4a;font-family:"Arial Black",Arial,sans-serif;font-size:21px;line-height:1.08;letter-spacing:-.7px}\n    .patio-service-features p{margin:0;color:#536475;font-size:13px;line-height:1.45}\n    .patio-price-wrap{width:min(1120px,calc(100% - 32px));margin:28px auto 0}\n    .patio-price{margin:0;padding:24px;border:0;border-radius:24px;background:#0b2d4a;color:#fff;box-shadow:0 14px 34px rgba(11,45,74,.12)}\n    .patio-price strong{color:#fff}.patio-price .btn-ghost{background:#fff;color:#0b2d4a;border-color:#fff}\n    .patio-price-actions{margin-top:10px;display:flex;flex-wrap:wrap;gap:10px}\n    @media(max-width:980px){body.page-patios-walkways>.hs-modern-header{top:10px}.patio-service-hero__grid{grid-template-columns:1fr;padding-top:145px}.patio-service-hero{min-height:auto}.patio-service-proof{display:grid;grid-template-columns:1fr 1fr}}\n    @media(max-width:650px){.patio-service-hero__grid{width:calc(100% - 24px);padding-top:110px;padding-bottom:48px}.patio-service-hero__glass{padding:26px 10px;border:0;border-radius:0;background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}.patio-service-hero h1,.patio-service-hero__subhead,.patio-service-hero__copy{text-shadow:0 2px 12px rgba(0,0,0,.78)}.patio-service-hero h1{font-size:40px}.patio-service-hero__subhead{font-size:18px}.patio-service-proof,.patio-service-features{grid-template-columns:1fr}.patio-service-features{width:100%;margin-top:0;border-radius:0}.patio-price-wrap{width:calc(100% - 24px);margin-top:18px}}\n  </style>\n'''
          if 'id="patio-service-redesign"' not in s:
              s=s.replace('</head>',css+'</head>',1)

          start=s.index('<body>')
          marker='    <section class="section" style="padding-top:6px;">'
          end=s.index(marker,start)

          top='''<body class="page-patios-walkways shared-footer-page">\n\n  <header class="hs-modern-header">\n    <nav class="hs-modern-nav hs-modern-shell" aria-label="Primary navigation">\n      <a class="hs-modern-logo" href="/" aria-label="HydroSeal home"><img alt="HydroSeal" src="/assets/hero/Hydrosealpaversealing.png" width="600" height="234"></a>\n      <button aria-expanded="false" aria-label="Open menu" class="hs-modern-toggle" type="button">☰</button>\n      <div class="hs-modern-menu">\n        <div class="hs-modern-group"><button aria-expanded="false" class="hs-modern-parent" type="button">Paver Sealing</button><div class="hs-modern-mega"><div class="hs-modern-column"><a href="/paver-sealing/driveways">Driveway Paver Sealing<small>Clean, resand, and protect</small></a><a href="/paver-sealing/pool-decks">Pool Deck Sealing<small>Moisture-aware preparation</small></a><a href="/paver-sealing/travertine-sealing">Travertine Sealing<small>Natural-stone specific care</small></a><a href="/paver-resealing/">Paver Resealing<small>Restore weathered protection</small></a></div><div class="hs-modern-column"><a href="/paver-sealing-cost-calculator">Instant Pricing Calculator<small>Estimate standard sealing cost</small></a><a href="/paver-sealing/sand-options">Joint Sand Options<small>ASTM C144 colors and selection</small></a></div></div></div>\n        <div class="hs-modern-group"><button aria-expanded="false" class="hs-modern-parent" type="button">Service Areas</button><div class="hs-modern-mega hs-modern-areas-menu"><a href="/service-areas/jacksonville">Jacksonville</a><a href="/service-areas/st-johns-county">St. Johns County</a><a href="/service-areas/clay-county">Clay County</a></div></div>\n        <div class="hs-modern-group"><button aria-expanded="false" class="hs-modern-parent" type="button">About</button><div class="hs-modern-mega hs-modern-about-menu"><a href="/about">About HydroSeal</a><a href="/learning-center/">Learning Center</a><a href="/care-program/">Care Program</a><a href="/warranty/">Warranty</a></div></div>\n        <a class="hs-modern-link" href="/faq">FAQ</a>\n      </div>\n      <a class="hs-modern-call" href="tel:+19045375000">Call 904.537.5000</a><a class="hs-modern-quote" href="/get-a-quote">Get a Quote</a>\n    </nav>\n  </header>\n\n  <main id="page" data-page>\n    <section class="patio-service-hero">\n      <img class="patio-service-hero__image" src="/assets/hero/clay-county-paver-sealing-walkway.webp" width="1200" height="675" alt="Clean sealed patio and walkway pavers in Northeast Florida" loading="eager" decoding="async" fetchpriority="high">\n      <div class="patio-service-hero__grid">\n        <div class="patio-service-hero__glass">\n          <p class="patio-service-hero__eyebrow">Patio &amp; walkway sealing in Northeast Florida</p>\n          <h1>Patio &amp; Walkway Paver Sealing in Jacksonville &amp; St. Johns</h1>\n          <div class="patio-service-hero__subhead">Cleaned. Resanded. Sealed. Built for Florida.</div>\n          <p class="patio-service-hero__copy">Professional paver sealing for patios, walkways, entries, and outdoor living spaces across Jacksonville and St. Johns County.</p>\n          <div class="patio-service-hero__actions"><a class="btn btn-primary" href="/get-a-quote">Request a Quote</a><a class="btn btn-ghost" href="/paver-sealing-cost-calculator">Try Instant Pricing</a></div>\n        </div>\n        <div class="patio-service-proof"><article class="patio-service-proof__card"><div class="patio-service-proof__google">Google</div><div class="patio-service-proof__stars">★★★★★</div><h3>5-STAR RATED PAVER RESTORATION.</h3><p>Careful preparation and clean finishing for outdoor living surfaces throughout Northeast Florida.</p><a href="https://share.google/4ddHhmrSn3woAYR6h" rel="noopener noreferrer" target="_blank">Read customer reviews →</a></article><div class="patio-service-proof__cert">TRIDENT MASTER CERTIFIED</div></div>\n      </div>\n    </section>\n\n    <section class="patio-service-features" aria-label="HydroSeal patio and walkway service standards">\n      <a href="#patio-process"><article><h3>DEEP CLEANING</h3><p>Surface preparation before sealing.</p></article></a>\n      <a href="/paver-sealing/sand-options"><article><h3>JOINT SAND</h3><p>Joint-sand restoration where needed.</p></article></a>\n      <a href="#patio-process"><article><h3>PATIO PROTECTION</h3><p>Even coverage for outdoor living areas.</p></article></a>\n      <a href="/warranty"><article><h3>2-YEAR WARRANTY</h3><p>Covered workmanship &amp; adhesion.</p></article></a>\n    </section>\n\n    <div class="patio-price-wrap"><div class="patio-price"><strong>Patio &amp; walkway paver sealing starts at $1.50/sq ft.</strong> Final pricing depends on surface condition, preparation needs, joint-sand restoration, repairs, and project access.<div class="patio-price-actions"><a class="btn btn-primary" href="tel:+19045375000">Call 904.537.5000</a><a class="btn btn-ghost" href="/get-a-quote">Request a Quote</a></div></div></div>\n\n'''
          s=s[:start]+top+s[end:]
          s=s.replace('<section style="margin-top:18px;" class="section">','<section id="patio-process" style="margin-top:18px;" class="section">',1)
          p.write_text(s)
          PY
      - name: Commit page update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add paver-sealing/patios-walkways.html
          git commit -m "Modernize patios and walkways service header" || true
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/rebuild-patios-top.yml
          git commit -m "Remove patios rebuild workflow" || true
          git push
