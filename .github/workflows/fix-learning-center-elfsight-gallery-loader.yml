name: Fix Learning Center Elfsight gallery loader
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate Elfsight platform scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = [
              Path('learning-center/surfaces/what-is-the-best-sand-for-paver-joints-in-florida/index.html'),
              Path('learning-center/travertine/should-you-seal-travertine-pool-decks-in-florida/index.html'),
          ]
          duplicate = '<script src="https://elfsightcdn.com/platform.js" async></script>\n'
          for p in pages:
              s = p.read_text(encoding='utf-8')
              if 'elfsight-app-bfab489f-7fca-4f05-ba5a-d92616b76b26' not in s:
                  raise SystemExit(f'Gallery app missing from {p}')
              s = s.replace(duplicate, '')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning-center/surfaces/what-is-the-best-sand-for-paver-joints-in-florida/index.html learning-center/travertine/should-you-seal-travertine-pool-decks-in-florida/index.html
          git diff --cached --quiet || git commit -m "Fix Elfsight galleries on Learning Center pages"
          git push
# trigger
