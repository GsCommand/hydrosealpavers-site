name: Show sand images
on:
  push:
    paths:
      - '.github/workflows/show-sand-images.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Force sand sample images visible
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('learning-center/surfaces/what-is-the-best-sand-for-paver-joints-in-florida/index.html')
          s = p.read_text(encoding='utf-8')
          old = '.sand-color-card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;border:1px solid rgba(0,0,0,.12);display:block}'
          new = '.sand-color-card img{display:block!important;visibility:visible!important;opacity:1!important;width:100%!important;height:auto!important;aspect-ratio:1/1;object-fit:cover;border-radius:12px;border:1px solid rgba(0,0,0,.12)}'
          if old in s:
              s = s.replace(old,new,1)
          else:
              s = s.replace('.sand-swatch-image{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;border:1px solid rgba(0,0,0,.12);display:block}', '.sand-swatch-image{display:block!important;visibility:visible!important;opacity:1!important;width:100%!important;height:auto!important;aspect-ratio:1/1;object-fit:cover;border-radius:12px;border:1px solid rgba(0,0,0,.12)}',1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning-center/surfaces/what-is-the-best-sand-for-paver-joints-in-florida/index.html
          git commit -m "Show sand color sample images in joint sand guide" || exit 0
          git push
