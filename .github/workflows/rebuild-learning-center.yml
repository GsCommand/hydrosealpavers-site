name: Rebuild Learning Center

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consolidate and rebuild
        run: python tools/build-learning-center-articles.py
      - name: Verify text-only output
        run: |
          test "$(find learning-center -mindepth 3 -name index.html | wc -l)" -eq 20
          ! grep -RIlE '<(img|picture|figure|source)\b|og:image|twitter:image' learning-center --include='*.html'
          ! grep -RIl 'This guide outlines the practical checks and next steps homeowners can use when evaluating this paver concern.' learning-center --include='*.html'
          test ! -d learning-center/search
          test ! -d learning-center/video-tutorials
