name: Remove Learning Center topic boxes
on:
  push:
    paths:
      - '.github/remove-learning-center-topic-boxes-trigger'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove Learning Center topic directory
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('learning-center/index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'<nav class="lc-hub-directory" aria-label="Learning Center topics">.*?</nav>'
          new, count = re.subn(pattern, '', s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'expected 1 topic directory, found {count}')
          p.write_text(new, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning-center/index.html
          git commit -m "Remove Learning Center topic boxes" || exit 0
          git push
