name: Add worth it before after image
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert before after image
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('learning-center/sealing/is-paver-sealing-worth-it-in-florida/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<h2>What sealing can realistically do</h2>'
          block = '<figure class="hs-worth-it-before-after" style="display:block!important;margin:28px 0 30px!important"><img src="/assets/hero/Before-After-Why-should-I-seal.png" alt="Before and after example showing the appearance of sealed pavers" loading="lazy" style="display:block!important;visibility:visible!important;opacity:1!important;width:100%!important;height:auto!important;border-radius:18px!important"></figure>'
          if marker not in s:
              raise SystemExit('Target heading not found')
          if '/assets/hero/Before-After-Why-should-I-seal.png' not in s:
              s = s.replace(marker, block + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning-center/sealing/is-paver-sealing-worth-it-in-florida/index.html
          git diff --cached --quiet || git commit -m "Add before after image to paver sealing worth it guide"
          git push
