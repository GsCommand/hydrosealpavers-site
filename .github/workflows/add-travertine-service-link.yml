name: Add travertine service link
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add contextual travertine sealing link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('learning-center/travertine/how-to-clean-travertine-without-damage/index.html')
          s = p.read_text(encoding='utf-8')
          old = 'Shade and humidity increase dwell time for organic growth.</p></section>'
          new = 'Shade and humidity increase dwell time for organic growth. For professional cleaning, sealing, and natural-stone protection options, see our <a href="/paver-sealing/travertine-sealing">Travertine Sealing service</a>.</p></section>'
          if old not in s:
              raise SystemExit('Target paragraph not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning-center/travertine/how-to-clean-travertine-without-damage/index.html
          git diff --cached --quiet || git commit -m "Link travertine cleaning guide to service page"
          git push
