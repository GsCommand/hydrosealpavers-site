name: Refine authority links

on:
  push:
    branches:
      - seo/internal-authority-funnel

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/internal-authority-funnel
          fetch-depth: 0
      - run: python tools/refine-authority-links.py
      - shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "HydroSeal Site Automation"
          git config user.email "site-automation@users.noreply.github.com"
          git add learning-center/hiring/how-to-choose-a-paver-sealing-company-in-northeast-florida/index.html
          git commit -m "Preserve local detail in authority links"
          git push origin HEAD:seo/internal-authority-funnel
