name: Fix resealing hero source

on:
  push:
    paths:
      - '.github/workflows/fix-resealing-hero-source.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace old resealing hero references
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('paver-resealing/index.html')
          text = p.read_text()
          old = '/assets/hero/paver-sealing-jacksonville-driveway.webp'
          new = '/assets/hero/Paver-Resealing.jpeg'
          if old not in text:
              print('Old hero reference not found; nothing to replace.')
          else:
              text = text.replace(old, new)
              p.write_text(text)
              print('Replaced all old hero references in paver-resealing/index.html')
          PY
      - name: Commit source fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-resealing-hero-source.yml
          git add paver-resealing/index.html
          git diff --cached --quiet || git commit -m 'Use resealing hero image from first paint'
          git push
