name: Remove Strip and Reseal nav

on:
  push:
    paths:
      - '.github/workflows/remove-strip-reseal-nav.yml'

permissions:
  contents: write

jobs:
  clean-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove exact Strip and Reseal nav item from 13 pages
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              'index.html',
              'about/index.html',
              'faq/index.html',
              'warranty/index.html',
              'care-program/index.html',
              'learning-center/local/index.html',
              'paver-sealing/pool-decks.html',
              'paver-sealing/travertine-sealing.html',
              'paver-sealing/sand-options.html',
              'paver-sealing-cost-calculator/index.html',
              'service-areas/jacksonville/index.html',
              'service-areas/st-johns-county/index.html',
              'service-areas/clay-county/index.html',
          ]

          needle = '<a href="/paver-resealing">Strip and Reseal<small>Correct failed or cloudy coatings</small></a>'
          failures = []
          changed = []

          for name in files:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              count = text.count(needle)
              if count != 1:
                  failures.append(f'{name}: expected 1 exact nav item, found {count}')
                  continue
              path.write_text(text.replace(needle, ''), encoding='utf-8')
              changed.append(name)

          if failures:
              raise SystemExit('\n'.join(failures))

          print('Updated files:')
          print('\n'.join(changed))
          PY
      - name: Verify nav item is gone from targeted pages
        run: |
          if grep -F -n 'Correct failed or cloudy coatings' \
            index.html \
            about/index.html \
            faq/index.html \
            warranty/index.html \
            care-program/index.html \
            learning-center/local/index.html \
            paver-sealing/pool-decks.html \
            paver-sealing/travertine-sealing.html \
            paver-sealing/sand-options.html \
            paver-sealing-cost-calculator/index.html \
            service-areas/jacksonville/index.html \
            service-areas/st-johns-county/index.html \
            service-areas/clay-county/index.html; then
              echo 'Strip and Reseal nav item still found.'
              exit 1
          fi
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/remove-strip-reseal-nav.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html \
            about/index.html \
            faq/index.html \
            warranty/index.html \
            care-program/index.html \
            learning-center/local/index.html \
            paver-sealing/pool-decks.html \
            paver-sealing/travertine-sealing.html \
            paver-sealing/sand-options.html \
            paver-sealing-cost-calculator/index.html \
            service-areas/jacksonville/index.html \
            service-areas/st-johns-county/index.html \
            service-areas/clay-county/index.html \
            .github/workflows/remove-strip-reseal-nav.yml
          git commit -m 'Remove Strip and Reseal from all hardcoded navigation'
          git push origin HEAD:main
