name: Hardcode search intent copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hardcode-search-intent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply static HTML migration
        run: python tools/hardcode-search-intent.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Hardcode targeted paver search-intent copy in HTML"
          git push origin HEAD:main
