name: Remove Yulee from HydroSeal navigation

on:
  push:
    paths:
      - '.github/workflows/remove-yulee-nav.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove standalone Yulee navigation links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          target = 'https://www.yuleepaversealing.com/'
          pattern = re.compile(
              r'\s*<a\b(?=[^>]*\bhref=["\']' + re.escape(target) + r'["\'])[^>]*>\s*Yulee\s*</a>',
              flags=re.I
          )

          changed = []
          for p in Path('.').rglob('*.html'):
              text = p.read_text()
              new, count = pattern.subn('', text)
              if count:
                  p.write_text(new)
                  changed.append((p.as_posix(), count))

          print('Removed standalone Yulee nav links from:')
          for path, count in changed:
              print(f'  {path}: {count}')

          offenders = []
          for p in Path('.').rglob('*.html'):
              text = p.read_text()
              if re.search(r'<a\b(?=[^>]*\bhref=["\']' + re.escape(target) + r'["\'])[^>]*>\s*Yulee\s*</a>', text, flags=re.I):
                  offenders.append(p.as_posix())
          if offenders:
              raise SystemExit('Standalone Yulee navigation links remain: ' + ', '.join(offenders))
          PY
          git diff --check

      - name: Commit navigation cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git diff --cached --check
          git commit -m "Remove Yulee from HydroSeal navigation" || exit 0
          git push
