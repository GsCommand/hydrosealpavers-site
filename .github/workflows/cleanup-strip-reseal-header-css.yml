name: Clean strip reseal legacy header CSS
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unused legacy header CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('learning-center/cost/how-much-does-it-cost-to-strip-and-reseal-pavers/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('  <link rel="stylesheet" href="/assets/css/modern-header.css?v=20260807-2">\n', '')
          s = re.sub(r'\n\s*\.local-header \.hs-modern-nav\{[^\n]*\}\n\s*\.local-header \.hs-modern-logo\{[^\n]*\}\n\s*\.local-header \.hs-modern-menu\{[^\n]*\}\n\s*\.local-header \.hs-modern-actions\{[^\n]*\}\n', '\n', s, count=1)
          s = re.sub(r'\n\s*@media\(max-width:980px\)\{\n\s*\.local-header \.hs-modern-nav\{display:flex\}\n\s*\.local-header \.hs-modern-logo\{margin-right:auto\}\n\s*\.local-header \.hs-modern-actions\{display:none\}\n\s*\}\n', '\n', s, count=1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning-center/cost/how-much-does-it-cost-to-strip-and-reseal-pavers/index.html
          git diff --cached --quiet || git commit -m "Remove legacy strip reseal header CSS"
          git push
