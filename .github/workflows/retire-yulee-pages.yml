name: Retire HydroSeal Yulee pages

on:
  push:
    paths:
      - '.github/workflows/retire-yulee-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Retire Yulee and Wildlight HydroSeal landing pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          YULEE = 'https://www.yuleepaversealing.com/'
          WILDLIGHT = 'https://www.yuleepaversealing.com/wildlight-paver-sealing.html'
          OLD_YULEE = 'https://hydrosealpavers.com/service-areas/yulee'
          OLD_WILDLIGHT = 'https://hydrosealpavers.com/service-areas/wildlight'

          for p in Path('.').rglob('*.html'):
              if p.as_posix() in ('service-areas/yulee.html', 'service-areas/wildlight.html'):
                  continue
              s = p.read_text()
              s = s.replace('href="/service-areas/yulee"', f'href="{YULEE}"')
              s = s.replace("href='/service-areas/yulee'", f"href='{YULEE}'")
              s = s.replace('href="/service-areas/wildlight"', f'href="{WILDLIGHT}"')
              s = s.replace("href='/service-areas/wildlight'", f"href='{WILDLIGHT}'")
              s = s.replace(OLD_YULEE, YULEE)
              s = s.replace(OLD_WILDLIGHT, WILDLIGHT)
              p.write_text(s)

          p = Path('sitemap.xml')
          s = p.read_text()
          s = re.sub(
              r'\s*<url>\s*<loc>https://hydrosealpavers\.com/service-areas/yulee</loc>[\s\S]*?</url>\s*',
              '\n', s
          )
          p.write_text(s)

          p = Path('llms.txt')
          s = p.read_text()
          s = s.replace('- Yulee & Wildlight HydroSeal service coverage: https://hydrosealpavers.com/service-areas/yulee\n', '')
          s = s.replace('- Yulee / Wildlight: https://hydrosealpavers.com/service-areas/yulee\n', '')
          s = s.replace('https://hydrosealpavers.com/service-areas/yulee', YULEE)
          s = s.replace('https://hydrosealpavers.com/service-areas/wildlight', WILDLIGHT)
          p.write_text(s)

          p = Path('vercel.json')
          cfg = json.loads(p.read_text())
          sources = {
              '/service-areas/yulee': YULEE,
              '/service-areas/yulee.html': YULEE,
              '/service-areas/wildlight': WILDLIGHT,
              '/service-areas/wildlight.html': WILDLIGHT,
          }
          redirects = [r for r in cfg.get('redirects', []) if r.get('source') not in sources]
          new_redirects = [
              {'source': src, 'destination': dest, 'permanent': True}
              for src, dest in sources.items()
          ]
          cfg['redirects'] = new_redirects + redirects
          p.write_text(json.dumps(cfg, indent=2) + '\n')

          for name in ('service-areas/yulee.html', 'service-areas/wildlight.html'):
              q = Path(name)
              if q.exists():
                  q.unlink()

          assert not Path('service-areas/yulee.html').exists()
          assert not Path('service-areas/wildlight.html').exists()
          assert OLD_YULEE not in Path('sitemap.xml').read_text()
          cfg = json.loads(Path('vercel.json').read_text())
          by_source = {r.get('source'): r.get('destination') for r in cfg.get('redirects', [])}
          assert by_source['/service-areas/yulee'] == YULEE
          assert by_source['/service-areas/yulee.html'] == YULEE
          assert by_source['/service-areas/wildlight'] == WILDLIGHT
          assert by_source['/service-areas/wildlight.html'] == WILDLIGHT

          offenders = []
          for q in Path('.').rglob('*.html'):
              text = q.read_text()
              if 'href="/service-areas/yulee"' in text or "href='/service-areas/yulee'" in text:
                  offenders.append(str(q))
              if 'href="/service-areas/wildlight"' in text or "href='/service-areas/wildlight'" in text:
                  offenders.append(str(q))
          if offenders:
              raise SystemExit('Retired internal links remain: ' + ', '.join(sorted(set(offenders))))
          PY
          git diff --check

      - name: Commit retirement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/*'
          git diff --cached --check
          git commit -m "Retire HydroSeal Yulee and Wildlight landing pages" || exit 0
          git push
