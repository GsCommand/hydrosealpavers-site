name: Fix travertine CLS
on:
  push:
    paths:
      - '.github/workflows/fix-travertine-cls.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Stabilize travertine mobile layout and contrast
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('paver-sealing/travertine-sealing.html')
          s = p.read_text(encoding='utf-8')

          old = '<style id="hs-critical-base">:root{--navy:#0B2D4A;--blue:#0F6EA8;--teal:#28B6C8;--text:#0B1220;--muted:#334155;--bg:#fff;--line:#e5e7eb;--h2-blue:#2FA8CF;--h3-blue:#1B4E63;--water-blue:#39BFEA;--cta-green:#2fbe63}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}img,svg,video,canvas{max-width:100%;height:auto;display:block}.container,.shell{max-width:1120px;margin:0 auto;padding:0 16px}.btn{display:inline-flex;align-items:center;justify-content:center}</style>'

          new = '''<style id="hs-critical-base">:root{--navy:#0B2D4A;--blue:#0F6EA8;--teal:#28B6C8;--text:#0B1220;--muted:#334155;--bg:#fff;--line:#e5e7eb;--h2-blue:#0F6EA8;--h3-blue:#1B4E63;--water-blue:#39BFEA;--cta-green:#2fbe63;--radius:18px;--section-space-desktop:80px;--section-space-mobile:48px}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}img,svg,video,canvas{max-width:100%;height:auto;display:block}.container,.shell{max-width:1120px;margin:0 auto;padding:0 16px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;font-weight:900}.section{padding:var(--section-space-desktop) 0}.grid{display:grid;gap:14px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{border:1px solid var(--line);border-radius:var(--radius);padding:18px;background:#fff}.notice{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:#f9fafb}.mobile-hero-label{display:none}@media(max-width:900px){.section{padding:var(--section-space-mobile) 0}.grid-2{grid-template-columns:1fr}}@media(max-width:650px){.mobile-hero-label{position:absolute;z-index:4;top:50%;left:50%;display:block;width:max-content;max-width:calc(100% - 40px);padding:14px 20px;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.32);border-radius:16px;background:rgba(8,35,55,.30);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font-weight:900;font-size:clamp(22px,7vw,34px);line-height:1.04;letter-spacing:-.02em;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.45)}}</style>'''

          if old not in s:
              raise SystemExit('critical CSS anchor not found')
          s = s.replace(old, new, 1)

          fixes = '''\n<style id="travertine-pagespeed-fixes">\n.card h2,#travertine-faq h2{color:#0b5f8a}\n.related-links-section a{color:#075985!important}\n.related-links-section h3{color:#0b4f6c}\n.cta .btn-green{background:#147a3f;color:#fff}\n@media(prefers-reduced-motion:reduce){.card,.card img,.related-links-section a,.trav-service-features article{transition:none!important}}\n</style>\n'''
          if 'id="travertine-pagespeed-fixes"' not in s:
              s = s.replace('</head>', fixes + '</head>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paver-sealing/travertine-sealing.html
          git commit -m "Fix travertine CLS and contrast" || exit 0
          git push
