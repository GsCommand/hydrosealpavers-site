name: Center joint sand CTA copy
on:
  push:
    paths:
      - '.github/workflows/center-joint-sand-cta-copy.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Center joint sand CTA title and text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/js/third-party-loader.js')
          s = p.read_text(encoding='utf-8')
          marker = "  fixJointSandColorCards();\n  styleLearningCenterCtas();\n"
          block = """  fixJointSandColorCards();\n  styleLearningCenterCtas();\n\n  if (path === '/learning-center/surfaces/what-is-the-best-sand-for-paver-joints-in-florida') {\n    const cta = document.querySelector('.blog-post__cta');\n    if (cta) {\n      const heading = cta.querySelector('h2');\n      const copy = cta.querySelector('p:not(:last-child)');\n      if (heading) {\n        heading.textContent = 'Need Joint-Sand Restoration?';\n        heading.style.textAlign = 'center';\n      }\n      if (copy) copy.style.textAlign = 'center';\n    }\n  }\n"""
          if "heading.textContent = 'Need Joint-Sand Restoration?'" not in s:
              if marker not in s:
                  raise SystemExit('insertion marker not found')
              s = s.replace(marker, block, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/third-party-loader.js
          git commit -m "Center joint sand CTA title and copy" || exit 0
          git push
