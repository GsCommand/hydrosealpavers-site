name: Internal authority funnel

on:
  push:
    branches:
      - seo/internal-authority-funnel

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/internal-authority-funnel
          fetch-depth: 0
      - name: Apply contextual authority links
        run: python tools/apply-internal-authority.py
      - name: Commit branch-only changes
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "HydroSeal Site Automation"
          git config user.email "site-automation@users.noreply.github.com"
          git add -A
          git commit -m "Route Learning Center authority into core service pages"
          git push origin HEAD:seo/internal-authority-funnel
