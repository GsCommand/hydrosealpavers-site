name: Fix Learning Center Elfsight visibility
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add scoped Elfsight visibility override
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = [
              Path('learning-center/surfaces/what-is-the-best-sand-for-paver-joints-in-florida/index.html'),
              Path('learning-center/travertine/should-you-seal-travertine-pool-decks-in-florida/index.html'),
          ]
          marker = '<!-- Elfsight Photo Gallery | DriveWay Gallery -->'
          style = '''<style id="hs-lc-elfsight-visibility">
.page-learning-center .blog-post [class*="elfsight-app-"] img,
.page-learning-center .blog-post [class*="elfsight-app-"] figure,
.page-learning-center .blog-post [class*="elfsight-app-"] picture,
.page-learning-center .blog-post [class*="elfsight-app-"] svg{display:revert!important;visibility:visible!important;opacity:1!important}
.page-learning-center .blog-post [class*="elfsight-app-"]{display:block!important;min-height:260px!important;margin:28px 0 34px!important}
.page-learning-center .blog-post [class*="elfsight-app-"] iframe{display:block!important;width:100%!important;min-height:260px!important}
</style>
'''
          for p in pages:
              s = p.read_text(encoding='utf-8')
              if marker not in s:
                  raise SystemExit(f'Gallery marker missing from {p}')
              if 'id="hs-lc-elfsight-visibility"' not in s:
                  s = s.replace(marker, style + marker, 1)
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning-center/surfaces/what-is-the-best-sand-for-paver-joints-in-florida/index.html learning-center/travertine/should-you-seal-travertine-pool-decks-in-florida/index.html
          git diff --cached --quiet || git commit -m "Show Elfsight galleries in Learning Center articles"
          git push
# trigger
