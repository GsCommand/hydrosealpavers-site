name: Add AI chatbot sitewide
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/ai-chatbot-sitewide-trigger'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject HydroSeal AI Elfsight widget into every HTML page
        run: |
          python - <<'PY'
          from pathlib import Path

          app_id = 'elfsight-app-8d93a5a4-3fe5-4e4e-a7d5-1856bb997b36'
          snippet = '''\n<!-- Elfsight AI Chatbot | HydroSeal AI Chatbot -->\n<script src="https://elfsightcdn.com/platform.js" async></script>\n<div class="elfsight-app-8d93a5a4-3fe5-4e4e-a7d5-1856bb997b36" data-elfsight-app-lazy></div>\n'''

          changed = []
          skipped = []
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts or '.github' in p.parts:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if app_id in s:
                  skipped.append(str(p))
                  continue
              if '</body>' in s:
                  s = s.replace('</body>', snippet + '</body>', 1)
              elif '</html>' in s:
                  s = s.replace('</html>', snippet + '</html>', 1)
              else:
                  s += snippet
              p.write_text(s, encoding='utf-8')
              changed.append(str(p))

          print(f'Changed {len(changed)} HTML files')
          print(f'Skipped {len(skipped)} files already containing chatbot')
          if changed:
              print('\n'.join(changed))
          PY

      - name: Commit sitewide chatbot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html' 2>/dev/null || true
          git add -A
          git commit -m "Add HydroSeal AI chatbot to every page" || exit 0
          git push
