name: Consolidate service area SEO

on:
  push:
    paths:
      - 'tools/consolidate-service-areas.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate service area architecture
        run: python tools/consolidate-service-areas.py

      - name: Verify location architecture
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          data = json.loads(Path('vercel.json').read_text())
          redirects = {r['source']: r['destination'] for r in data.get('redirects', [])}
          expected = {
            '/service-areas/wildlight': 'https://hydrosealpavers.com/service-areas/yulee',
            '/service-areas/jacksonville/atlantic-beach': 'https://hydrosealpavers.com/service-areas/jacksonville/jacksonville-beach',
            '/service-areas/st-johns-county/del-webb-ponte-vedra': 'https://hydrosealpavers.com/service-areas/st-johns-county/nocatee',
            '/service-areas/clay-county/green-cove-springs': 'https://hydrosealpavers.com/service-areas/clay-county',
          }
          for source, destination in expected.items():
              assert redirects.get(source) == destination, (source, redirects.get(source))

          root = ET.parse('sitemap.xml').getroot()
          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs = {node.text for node in root.findall('s:url/s:loc', ns)}
          assert 'https://hydrosealpavers.com/service-areas/yulee' in locs
          assert 'https://hydrosealpavers.com/service-areas/st-johns-county/trailmark' in locs
          assert 'https://hydrosealpavers.com/service-areas/wildlight' not in locs
          assert 'https://hydrosealpavers.com/service-areas/jacksonville/atlantic-beach' not in locs
          assert Path('service-areas/st-johns-county/trailmark.html').exists()

          location_locs = sorted(x for x in locs if '/service-areas/' in x or x.endswith('/service-areas'))
          print('Core service-area sitemap URLs:', len(location_locs))
          for loc in location_locs:
              print(loc)
          PY

      - name: Commit consolidated location architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel.json sitemap.xml sitemap.html service-areas tools/consolidate-service-areas.py
          git commit -m "Consolidate service area SEO architecture" || exit 0
          git push
