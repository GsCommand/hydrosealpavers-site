name: Polish Southside customer copy

on:
  push:
    paths:
      - '.github/workflows/polish-jacksonville-southside-copy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove internal architecture language
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('service-areas/jacksonville/southside.html')
          s=p.read_text()
          s=s.replace('One strong Southside page for five important local markets.','Southside coverage for five important Jacksonville communities.')
          s=s.replace('Instead of splitting closely related Southside communities across many shallow pages, this page carries the service context for the places where similar driveway, irrigation and exposure patterns overlap.','HydroSeal serves Southside Jacksonville and selected nearby communities where large driveways, irrigation, strong sun and similar daily-use patterns create many of the same paver maintenance concerns.')
          p.write_text(s)
          PY
          git diff --check
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-areas/jacksonville/southside.html
          git diff --cached --check
          git commit -m "Polish Southside location copy" || exit 0
          git push
