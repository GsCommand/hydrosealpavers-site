name: Fix schema area consistency

on:
  push:
    branches:
      - seo/schema-area-consistency

permissions:
  contents: write

jobs:
  fix-schema:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/schema-area-consistency
          fetch-depth: 0
      - run: python tools/fix-schema-area-consistency.py
      - shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "HydroSeal Site Automation"
          git config user.email "site-automation@users.noreply.github.com"
          git add service-areas/clay-county/index.html service-areas/st-johns-county/index.html
          git commit -m "Align service-area schema with county hubs"
          git push origin HEAD:seo/schema-area-consistency
