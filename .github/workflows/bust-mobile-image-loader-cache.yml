name: Bust mobile image loader cache

on:
  push:
    paths:
      - '.github/workflows/bust-mobile-image-loader-cache.yml'

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version mobile image loader scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          version = '20260912-mobile-image-order-1'
          targets = [
              Path('index.html'),
              Path('paver-sealing/driveways.html'),
              Path('paver-cleaning/index.html'),
              Path('paver-sealing/pool-decks.html'),
              Path('paver-repair/index.html'),
              Path('paver-sealing/travertine-sealing.html'),
              Path('paver-sealing/sand-options.html'),
              Path('paver-resealing/index.html'),
              Path('paver-sealing-cost-calculator/index.html'),
          ]
          for p in targets:
              s = p.read_text()
              s = s.replace('/assets/js/analytics.js?v=20260912-mobile-image-order-1', '/assets/js/analytics.js')
              s = s.replace('/assets/js/third-party-loader.js?v=20260912-mobile-image-order-1', '/assets/js/third-party-loader.js')
              s = s.replace('/assets/js/analytics.js', f'/assets/js/analytics.js?v={version}')
              s = s.replace('/assets/js/third-party-loader.js', f'/assets/js/third-party-loader.js?v={version}')
              p.write_text(s)

          p = Path('assets/js/analytics.js')
          s = p.read_text()
          s = s.replace("script[src=\"/assets/js/third-party-loader.js\"]", "script[src*=\"/assets/js/third-party-loader.js\"]")
          s = s.replace('loader.src = "/assets/js/third-party-loader.js";', f'loader.src = "/assets/js/third-party-loader.js?v={version}";')
          p.write_text(s)
          PY

      - name: Validate versioning
        run: |
          grep -F 'analytics.js?v=20260912-mobile-image-order-1' index.html
          grep -F 'third-party-loader.js?v=20260912-mobile-image-order-1' index.html
          grep -F 'third-party-loader.js?v=20260912-mobile-image-order-1' assets/js/analytics.js

      - name: Commit cache bust
        run: |
          git config user.name "HydroSeal Site Automation"
          git config user.email "site-automation@users.noreply.github.com"
          git add index.html paver-sealing/driveways.html paver-cleaning/index.html paver-sealing/pool-decks.html paver-repair/index.html paver-sealing/travertine-sealing.html paver-sealing/sand-options.html paver-resealing/index.html paver-sealing-cost-calculator/index.html assets/js/analytics.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Bust mobile image loader cache"
          git push origin HEAD:main
