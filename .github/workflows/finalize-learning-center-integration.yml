name: Finalize Learning Center SEO integration
on:
  push:
    paths:
      - '.github/workflows/finalize-learning-center-integration.yml'
permissions:
  contents: write
jobs:
  finalize:
    if: contains(github.event.head_commit.message, 'Finalize Learning Center SEO integration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Learning Center, sitemap, llms and best-sealer guide
        run: |
          python - <<'PY'
          from pathlib import Path
          ROOT='https://hydrosealpavers.com'
          TODAY='2026-08-07'

          lc=Path('learning-center/index.html')
          text=lc.read_text()
          if 'lc-hub-directory' not in text:
              css='<style>.lc-hub-directory{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 28px}.lc-hub-directory a{display:block;padding:18px;border:1px solid #dce3e9;border-radius:17px;background:#fff;color:#0f3155;text-decoration:none;font-weight:850}.lc-hub-directory small{display:block;margin-top:5px;color:#5f6f80;font-weight:500;line-height:1.45}@media(max-width:800px){.lc-hub-directory{grid-template-columns:1fr 1fr}}@media(max-width:520px){.lc-hub-directory{grid-template-columns:1fr}}</style>'
              text=text.replace('</head>',css+'</head>')
              hubs='''<nav class="lc-hub-directory" aria-label="Learning Center topics"><a href="/learning-center/sealing/">Paver Sealing Guides<small>Products, finishes, weather, cure and longevity</small></a><a href="/learning-center/cleaning/">Paver Cleaning Guides<small>Safe cleaning, pressure and organic growth</small></a><a href="/learning-center/sand-joints/">Paver Sand &amp; Joint Guides<small>Resanding, depth, washout, weeds and ants</small></a><a href="/learning-center/problems/">Paver Problems &amp; Restoration<small>Efflorescence, white pavers, peeling and repair</small></a><a href="/learning-center/travertine/">Travertine Guides<small>Stone cleaning, sealing and pool decks</small></a><a href="/learning-center/cost-hiring/">Paver Cost &amp; Hiring Guides<small>Prices, scopes, estimates and contractor selection</small></a></nav>'''
              text=text.replace('<section class="lc-featured">',hubs+'<section class="lc-featured">',1)
              text=text.replace('Browse 28 practical guides','Browse practical guides').replace('<strong>28</strong><span>Detailed guides</span>','<strong>38+</strong><span>Detailed guides &amp; service resources</span>')
              lc.write_text(text)

          sm=Path('sitemap.xml'); s=sm.read_text()
          s=s.replace('<url><loc>https://hydrosealpavers.com/paver-sealing/sand-options</loc><lastmod>2026-07-30</lastmod></url>','<url><loc>https://hydrosealpavers.com/paver-sealing/sand-options</loc><lastmod>2026-08-07</lastmod></url>')
          urls=['/paver-cleaning','/paver-repair','/paver-efflorescence-removal','/learning-center/sealing','/learning-center/cleaning','/learning-center/sand-joints','/learning-center/problems','/learning-center/travertine','/learning-center/cost-hiring','/learning-center/cost/paver-sealing-cost-jacksonville','/learning-center/surfaces/how-deep-should-paver-sand-be','/learning-center/problems/why-do-weeds-grow-between-pavers','/learning-center/problems/why-are-ants-coming-through-paver-joints','/learning-center/sealing/when-to-seal-new-pavers','/learning-center/sealing/rain-after-paver-sealing','/learning-center/sealing/how-many-coats-of-paver-sealer']
          additions=[]
          for u in urls:
              if f'<loc>{ROOT}{u}</loc>' not in s:
                  additions.append(f'  <url><loc>{ROOT}{u}</loc><lastmod>{TODAY}</lastmod></url>')
          if additions:
              s=s.replace('</urlset>','\n'.join(additions)+'\n</urlset>')
          sm.write_text(s)

          ll=Path('llms.txt'); l=ll.read_text()
          if '## Learning Center topic hubs' not in l:
              l += '''\n\n## Learning Center topic hubs\n- Paver Sealing Guides: https://hydrosealpavers.com/learning-center/sealing\n- Paver Cleaning Guides: https://hydrosealpavers.com/learning-center/cleaning\n- Paver Sand & Joint Guides: https://hydrosealpavers.com/learning-center/sand-joints\n- Paver Problems & Restoration: https://hydrosealpavers.com/learning-center/problems\n- Travertine Guides: https://hydrosealpavers.com/learning-center/travertine\n- Paver Cost & Hiring Guides: https://hydrosealpavers.com/learning-center/cost-hiring\n\n## Additional current commercial resources\n- Paver Cleaning Jacksonville: https://hydrosealpavers.com/paver-cleaning\n- Paver Repair & Leveling Jacksonville: https://hydrosealpavers.com/paver-repair\n- Paver Efflorescence Removal Jacksonville: https://hydrosealpavers.com/paver-efflorescence-removal\n- Paver Sealing Cost Jacksonville: https://hydrosealpavers.com/learning-center/cost/paver-sealing-cost-jacksonville\n'''
              l=l.replace('learning_center_set_verified: "2026-08-01"','learning_center_set_verified: "2026-08-07"').replace('last_verified: "2026-08-01"','last_verified: "2026-08-07"')
              ll.write_text(l)

          best=Path('learning-center/sealing/how-to-choose-the-right-paver-sealer-for-your-home/index.html')
          b=best.read_text()
          marker='<section><h2>Frequently asked questions</h2>'
          if 'Gloss, satin, matte and penetrating finishes' not in b and marker in b:
              extra='''<section><h2>Gloss, satin, matte and penetrating finishes</h2><p>Finish is not simply cosmetic. Higher film build and stronger color enhancement can make joint lines and paver color more dramatic, while natural-look penetrating systems are selected when minimal appearance change and vapor movement are priorities. Wet areas also require traction to be considered independently from gloss.</p></section><section><h2>Breathability and moisture</h2><p>“Water based” does not automatically mean breathable and “solvent based” does not automatically mean non-breathable. Vapor transmission depends on the complete formulation and film build. In humid Florida conditions, moisture behavior should be evaluated with the surface and coating history.</p></section><section><h2>Best sealer for driveway, patio and pool deck pavers</h2><p>Driveways prioritize vehicle wear, stains and joint stability. Patios often prioritize appearance and maintenance. Pool decks add wet traction, standing water, chemicals and frequent barefoot use. The correct sealer can therefore differ across surfaces on the same property.</p></section>'''
              best.write_text(b.replace(marker,extra+marker,1))

          wf=Path('.github/workflows/finalize-learning-center-integration.yml')
          if wf.exists(): wf.unlink()
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire new SEO pages into Learning Center and sitemap"
          git push
