name: Restore HydroSeal microsite boundaries

on:
  push:
    paths:
      - '.github/workflows/restore-microsite-boundaries.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore HydroSeal Yulee and Wildlight coverage pages
        run: |
          git show ae4b69c1283a48093da91115f7f118c011b6f091:service-areas/yulee.html > service-areas/yulee.html
          git show ae4b69c1283a48093da91115f7f118c011b6f091:service-areas/wildlight.html > service-areas/wildlight.html

      - name: Re-establish parent coverage and deep-local boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          # Navigation on HydroSeal should stay inside the parent site. The coverage pages
          # themselves link out to the deeper local microsites.
          for p in Path('.').rglob('*.html'):
              s = p.read_text()
              s = s.replace('href="https://www.yuleepaversealing.com/"', 'href="/service-areas/yulee"')
              s = s.replace("href='https://www.yuleepaversealing.com/'", "href='/service-areas/yulee'")
              s = s.replace('href="https://www.yuleepaversealing.com/wildlight-paver-sealing.html"', 'href="/service-areas/wildlight"')
              s = s.replace("href='https://www.yuleepaversealing.com/wildlight-paver-sealing.html'", "href='/service-areas/wildlight'")
              p.write_text(s)

          # Service-area hub structured data should identify the HydroSeal coverage page,
          # not use the microsite as though it were a HydroSeal child URL.
          p = Path('service-areas/index.html')
          s = p.read_text()
          s = s.replace(
              '{"@type":"ListItem","position":4,"name":"Yulee & Wildlight","url":"https://www.yuleepaversealing.com/"}',
              '{"@type":"ListItem","position":4,"name":"Yulee & Wildlight","url":"https://hydrosealpavers.com/service-areas/yulee"}'
          )
          p.write_text(s)

          # Yulee: keep the HydroSeal page as a self-canonical parent coverage page,
          # while making the dedicated microsite the clearly labeled deeper local resource.
          p = Path('service-areas/yulee.html')
          s = p.read_text()
          old_title = 'Paver Sealing Yulee & Wildlight FL | Driveways, Patios & Pool Decks | HydroSeal'
          new_title = 'Yulee & Wildlight Paver Sealing Service Coverage | HydroSeal'
          old_desc = 'Paver sealing in Yulee and Wildlight, Florida for driveways, patios, walkways and pool decks with professional cleaning, joint restoration and sealing.'
          new_desc = 'HydroSeal parent-company service coverage for paver sealing in Yulee and Wildlight, Florida, with a dedicated local microsite for deeper service and neighborhood guidance.'
          s = s.replace(old_title, new_title)
          s = s.replace(old_desc, new_desc)
          s = s.replace('<h1>Paver Sealing in Yulee &amp; Wildlight</h1>', '<h1>HydroSeal Paver Sealing Service Coverage in Yulee &amp; Wildlight</h1>')
          coverage = '''\n  <section class="loc-section loc-section--soft" aria-label="Dedicated Yulee local resource">\n    <div class="loc-shell">\n      <div class="loc-card">\n        <span class="loc-eyebrow" style="color:#2b6b60;">HydroSeal parent service coverage</span>\n        <h2>Looking for the deeper Yulee local resource?</h2>\n        <p>This HydroSeal page confirms parent-company service coverage in Yulee and Wildlight. For Yulee-specific service pages, pricing, neighborhood guidance and detailed local information, visit <a href="https://www.yuleepaversealing.com/"><strong>Yulee Paver Sealing by HydroSeal</strong></a>.</p>\n      </div>\n    </div>\n  </section>'''
          hero = re.search(r'(<section class="loc-yulee-hero">[\s\S]*?</section>)', s)
          if not hero:
              raise SystemExit('Yulee hero not found')
          s = s[:hero.end()] + coverage + s[hero.end():]
          p.write_text(s)

          # Wildlight remains a supporting HydroSeal coverage page canonicalized to the
          # broader HydroSeal Yulee coverage URL; the microsite owns the deep local page.
          p = Path('service-areas/wildlight.html')
          s = p.read_text()
          s = s.replace('Paver Sealing Wildlight FL | HydroSeal', 'Wildlight Paver Sealing Service Coverage | HydroSeal')
          s = s.replace(
              'Professional paver sealing in Wildlight, FL for driveways, patios, pool decks, and walkways with proper prep and long-term protection.',
              'HydroSeal parent-company service coverage for paver sealing in Wildlight, FL, with a dedicated Wildlight microsite page for deeper local guidance.'
          )
          s = s.replace(
              'Professional paver sealing in Wildlight, FL for driveways, patios, pool decks, and walkways. HydroSeal cleans, re-sands, and seals pavers for lasting color and protection.',
              'HydroSeal parent-company service coverage for Wildlight paver projects, with detailed local guidance available on the dedicated Yulee and Wildlight microsite.'
          )
          s = s.replace('<h1 style="margin:8px 0 0;">Paver Sealing in Wildlight, FL</h1>', '<h1 style="margin:8px 0 0;">HydroSeal Paver Sealing Service Coverage in Wildlight, FL</h1>')
          deep = '''\n    <section class="section" style="padding-top:6px;" aria-label="Dedicated Wildlight local resource"><div class="container"><div class="card"><p class="muted" style="margin:0;"><strong>HydroSeal parent service coverage:</strong> This page confirms HydroSeal coverage in Wildlight. For the deeper Wildlight service page, local project guidance and Wildlight-specific information, visit <a href="https://www.yuleepaversealing.com/wildlight-paver-sealing.html"><strong>Wildlight Paver Sealing by HydroSeal</strong></a>.</p></div></div></section>'''
          first = re.search(r'(<section class="section" style="padding-top:18px;">[\s\S]*?</section>)', s)
          if not first:
              raise SystemExit('Wildlight first section not found')
          s = s[:first.end()] + deep + s[first.end():]
          p.write_text(s)

          # Nocatee: preserve the HydroSeal service-area page, but clearly label the
          # microsite as the deeper Nocatee resource instead of creating two equivalent pages.
          p = Path('service-areas/st-johns-county/nocatee.html')
          s = p.read_text()
          s = s.replace(
              'Nocatee Paver Sealing | Driveways, Pool Decks & Patios | HydroSeal',
              'Nocatee Paver Sealing Service Coverage | HydroSeal'
          )
          s = s.replace(
              'Nocatee paver sealing for newer and established driveways, patios and pool decks exposed to strong sun, irrigation, storms and joint-sand wear.',
              'HydroSeal parent-company paver sealing service coverage for Nocatee, with a dedicated Nocatee microsite for deeper local service, pricing and project guidance.'
          )
          s = s.replace(
              '<h1>Paver Sealing for Nocatee’s High-Visibility Hardscapes</h1>',
              '<h1>HydroSeal Paver Sealing Service Coverage in Nocatee</h1>'
          )
          nocatee_resource = '<section class="rg-section rg-soft" aria-label="Dedicated Nocatee local resource"><div class="rg-shell"><div class="rg-card"><span class="rg-eyebrow">HydroSeal parent service coverage</span><h2>Need the deeper Nocatee local guide?</h2><p>This HydroSeal page confirms service coverage in Nocatee. For Nocatee-specific driveway, pool deck, travertine, joint-sand, pricing, warranty and local FAQ information, visit <a href="https://nocateepaversealing.com/"><strong>Nocatee Paver Sealing by HydroSeal</strong></a>.</p></div></div></section>'
          hero = re.search(r'(<section class="rg-hero-stat">[\s\S]*?</section>)', s)
          if not hero:
              raise SystemExit('Nocatee hero not found')
          s = s[:hero.end()] + nocatee_resource + s[hero.end():]
          p.write_text(s)

          # Remove the four redirects that bypassed the HydroSeal coverage pages.
          p = Path('vercel.json')
          config = json.loads(p.read_text())
          retired = {
              '/service-areas/yulee',
              '/service-areas/yulee.html',
              '/service-areas/wildlight',
              '/service-areas/wildlight.html',
          }
          config['redirects'] = [r for r in config.get('redirects', []) if r.get('source') not in retired]
          p.write_text(json.dumps(config, indent=2) + '\n')

          # Put the parent Yulee coverage URL back in the XML sitemap. Wildlight keeps
          # its canonical consolidated into the parent Yulee coverage page.
          p = Path('sitemap.xml')
          s = p.read_text()
          if 'https://hydrosealpavers.com/service-areas/yulee</loc>' not in s:
              entry = '  <url><loc>https://hydrosealpavers.com/service-areas/yulee</loc><lastmod>2026-09-07</lastmod></url>\n'
              marker = '  <url><loc>https://hydrosealpavers.com/paver-cleaning</loc>'
              if marker not in s:
                  raise SystemExit('sitemap insertion marker not found')
              s = s.replace(marker, entry + marker, 1)
          s = re.sub(
              r'(<loc>https://hydrosealpavers.com/service-areas/yulee</loc><lastmod>)[^<]+(</lastmod>)',
              r'\g<1>2026-09-07\g<2>', s
          )
          s = re.sub(
              r'(<loc>https://hydrosealpavers.com/service-areas/st-johns-county/nocatee</loc><lastmod>)[^<]+(</lastmod>)',
              r'\g<1>2026-09-07\g<2>', s
          )
          s = re.sub(
              r'(<loc>https://hydrosealpavers.com/service-areas</loc><lastmod>)[^<]+(</lastmod>)',
              r'\g<1>2026-09-07\g<2>', s
          )
          p.write_text(s)

          # Assertions: parent pages exist and no explicit redirect bypasses them.
          assert Path('service-areas/yulee.html').exists()
          assert Path('service-areas/wildlight.html').exists()
          config = json.loads(Path('vercel.json').read_text())
          assert not any(r.get('source') in retired for r in config.get('redirects', []))
          assert 'https://www.yuleepaversealing.com/' in Path('service-areas/yulee.html').read_text()
          assert 'https://nocateepaversealing.com/' in Path('service-areas/st-johns-county/nocatee.html').read_text()
          PY
          git diff --check

      - name: Commit parent coverage boundaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' service-areas/yulee.html service-areas/wildlight.html service-areas/st-johns-county/nocatee.html sitemap.xml vercel.json
          git diff --cached --check
          git commit -m "Restore HydroSeal parent coverage and microsite boundaries" || exit 0
          git push
