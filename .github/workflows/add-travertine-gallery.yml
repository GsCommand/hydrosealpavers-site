name: Add travertine article gallery
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert Elfsight gallery above Common questions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('learning-center/travertine/should-you-seal-travertine-pool-decks-in-florida/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<section><h2>Common questions</h2>'
          block = '<!-- Elfsight Photo Gallery | DriveWay Gallery -->\n<script src="https://elfsightcdn.com/platform.js" async></script>\n<div class="elfsight-app-bfab489f-7fca-4f05-ba5a-d92616b76b26" data-elfsight-app-lazy></div>\n'
          if marker not in s:
              raise SystemExit('Common questions heading not found')
          if 'elfsight-app-bfab489f-7fca-4f05-ba5a-d92616b76b26' not in s:
              s = s.replace(marker, block + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning-center/travertine/should-you-seal-travertine-pool-decks-in-florida/index.html
          git diff --cached --quiet || git commit -m "Add Elfsight gallery to travertine sealing guide"
          git push
# trigger
