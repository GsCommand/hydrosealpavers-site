name: Redesign driveway hero
on:
  push:
    paths:
      - '.github/workflows/redesign-driveway-hero.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace driveway hero
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('paver-sealing/driveways.html')
          html = path.read_text(encoding='utf-8')

          prehero_pattern = re.compile(
              r'\s*<!-- TRUST BAR \(global\) -->.*?<main id="page" data-page>\s*',
              re.S
          )
          match = prehero_pattern.search(html)
          if not match:
              raise SystemExit('Pre-hero block not found')

          prehero = match.group(0)
          header_end = match.start()
          main_start = '<main id="page" data-page>\n'
          html = html[:header_end] + main_start + html[match.end():]

          old_hero = re.compile(
              r'\s*<!-- HERO -->\s*<section class="hero2".*?</section>\s*',
              re.S
          )

          new_hero = r'''
<!-- DRIVEWAY HERO -->
<section class="driveway-modern-hero">
  <img
    class="driveway-modern-hero__bg"
    src="/assets/hero/hydroseal-driveway.webp"
    width="1920"
    height="1080"
    alt="Professionally cleaned, resanded, and sealed paver driveway in Jacksonville"
    loading="eager"
    decoding="async"
    fetchpriority="high"
  />
  <div class="driveway-modern-hero__grid hs-modern-shell">
    <div class="driveway-modern-hero__panel">
      <span class="driveway-modern-hero__eyebrow">DRIVEWAY PAVER RESTORATION IN NORTHEAST FLORIDA</span>
      <h1>Driveway Paver Sealing Jacksonville &amp; St. Johns County</h1>
      <h2>Cleaned. Resanded. Sealed. Built for Florida Driveways.</h2>
      <p>Professional driveway paver sealing with deep cleaning, ASTM C144 joint sand, breathable sealer, and careful preparation across Jacksonville, St. Johns County, and Clay County.</p>
      <div class="driveway-modern-hero__actions">
        <a class="driveway-modern-hero__primary" href="/get-a-quote">Request a Quote</a>
        <a class="driveway-modern-hero__secondary" href="/paver-sealing-cost-calculator">Try Instant Pricing</a>
      </div>
    </div>

    <div class="driveway-modern-hero__proof">
      <article class="driveway-modern-review-card">
        <div class="driveway-modern-google">Google</div>
        <div class="driveway-modern-stars" aria-label="Five stars">★★★★★</div>
        <h3>5-STAR RATED DRIVEWAY RESTORATION.</h3>
        <p>Homeowners choose HydroSeal when faded, dirty driveway pavers need more than a quick pressure wash.</p>
        <a href="https://share.google/4ddHhmrSn3woAYR6h" target="_blank" rel="noopener noreferrer">Read customer reviews →</a>
      </article>
      <div class="driveway-modern-certified">TRIDENT MASTER CERTIFIED</div>
    </div>
  </div>
</section>

<section class="driveway-modern-features hs-modern-shell" aria-label="Driveway sealing service standards">
  <article><h3>DEEP CLEANING</h3><p>Surface preparation before sealing.</p></article>
  <article><h3>JOINT SAND</h3><p>ASTM C144 kiln-dried sand.</p></article>
  <article><h3>BREATHABLE SEALER</h3><p>Two controlled coats for Florida conditions.</p></article>
  <article><h3>2-YEAR WARRANTY</h3><p>Covered workmanship and adhesion.</p></article>
</section>
'''

          html, count = old_hero.subn('\n' + new_hero + '\n', html, count=1)
          if count != 1:
              raise SystemExit(f'Expected one hero, replaced {count}')

          # Put breadcrumb and trust content below the new hero instead of above it.
          prehero_clean = prehero.replace('<main id="page" data-page>', '')
          insertion = new_hero.strip()
          html = html.replace(insertion, insertion + '\n' + prehero_clean.strip(), 1)

          css = r'''
<style id="driveway-modern-hero-styles">
.driveway-modern-hero{position:relative;min-height:720px;overflow:hidden;background:#0b2d4a;color:#fff;padding:128px 0 86px;font-family:Arial,Helvetica,sans-serif}
.driveway-modern-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,24,38,.20),rgba(5,24,38,.02) 58%,rgba(5,24,38,.10));pointer-events:none}
.driveway-modern-hero__bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.driveway-modern-hero__grid{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.62fr);gap:32px;align-items:center}
.driveway-modern-hero__panel{padding:34px 36px;border:1px solid rgba(255,255,255,.30);border-radius:30px;background:rgba(9,39,59,.24);box-shadow:0 24px 70px rgba(0,0,0,.20);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.driveway-modern-hero__eyebrow{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid rgba(255,255,255,.26);border-radius:999px;background:rgba(255,255,255,.08);font-weight:900;font-size:11px;letter-spacing:1.5px}
.driveway-modern-hero__eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:#39bfea;box-shadow:0 0 18px #39bfea}
.driveway-modern-hero h1{max-width:760px;margin:24px 0 12px;color:#fff;font-size:clamp(38px,5.2vw,70px);line-height:.96;letter-spacing:-2.8px;text-transform:uppercase;text-shadow:0 14px 36px rgba(0,0,0,.30)}
.driveway-modern-hero h2{margin:0;color:#9be6fa;font-size:clamp(17px,2vw,24px);line-height:1.2;text-transform:uppercase;letter-spacing:.2px}
.driveway-modern-hero__panel p{max-width:720px;margin:18px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,.94)}
.driveway-modern-hero__actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.driveway-modern-hero__primary,.driveway-modern-hero__secondary{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 22px;border-radius:999px;text-transform:uppercase;font-weight:950;font-size:13px;letter-spacing:.8px;text-decoration:none}
.driveway-modern-hero__primary{background:#39bfea;color:#fff;box-shadow:0 12px 30px rgba(57,191,234,.34)}
.driveway-modern-hero__secondary{background:#fff;color:#0b2d4a}
.driveway-modern-hero__proof{display:flex;flex-direction:column;gap:12px;align-self:center}
.driveway-modern-review-card{padding:28px;border-radius:24px;background:rgba(255,255,255,.94);color:#0b1220;box-shadow:0 22px 60px rgba(0,0,0,.20)}
.driveway-modern-google{display:inline-flex;padding:6px 10px;border-radius:999px;background:#fff;border:1px solid #e5e7eb;font-weight:800;color:#44505e;font-size:12px}
.driveway-modern-stars{margin-top:10px;color:#f8b400;letter-spacing:2px}
.driveway-modern-review-card h3{margin:15px 0 10px;font-size:25px;line-height:.95;letter-spacing:-.8px;color:#071329}
.driveway-modern-review-card p{margin:0;color:#44505e;font-size:14px;line-height:1.55}
.driveway-modern-review-card a{display:inline-block;margin-top:18px;color:#071329;font-weight:900;font-size:11px;letter-spacing:1px;text-transform:uppercase;text-decoration:none}
.driveway-modern-certified{display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:999px;background:#0f6ea8;color:#fff;font-size:13px;font-weight:950;text-align:center;box-shadow:0 14px 34px rgba(15,110,168,.28)}
.driveway-modern-features{position:relative;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);margin-top:-34px;background:#fff;border:10px solid #fff;border-radius:22px;box-shadow:0 18px 48px rgba(11,45,74,.14);overflow:hidden}
.driveway-modern-features article{padding:18px 20px;border-right:1px solid #dce5ea}
.driveway-modern-features article:last-child{border-right:0}
.driveway-modern-features h3{margin:0;color:#082f4f;font-size:16px;line-height:1}
.driveway-modern-features p{margin:6px 0 0;color:#647383;font-size:12px;line-height:1.35}
@media(max-width:980px){
  .driveway-modern-hero{min-height:auto;padding:98px 0 72px}
  .driveway-modern-hero__grid{grid-template-columns:1fr;gap:18px}
  .driveway-modern-hero__panel{padding:28px}
  .driveway-modern-hero__proof{display:grid;grid-template-columns:1fr 1fr;align-items:stretch}
  .driveway-modern-certified{border-radius:24px}
  .driveway-modern-features{grid-template-columns:repeat(2,1fr);margin-top:-24px}
  .driveway-modern-features article:nth-child(2){border-right:0}
  .driveway-modern-features article:nth-child(-n+2){border-bottom:1px solid #dce5ea}
}
@media(max-width:620px){
  .driveway-modern-hero{padding:88px 0 54px}
  .driveway-modern-hero__panel{padding:24px 20px;border-radius:22px}
  .driveway-modern-hero h1{font-size:40px;letter-spacing:-1.8px}
  .driveway-modern-hero__actions{display:grid}
  .driveway-modern-hero__primary,.driveway-modern-hero__secondary{width:100%}
  .driveway-modern-hero__proof{grid-template-columns:1fr}
  .driveway-modern-review-card{padding:22px}
  .driveway-modern-features{grid-template-columns:1fr;margin-top:-16px;border-width:7px}
  .driveway-modern-features article{border-right:0;border-bottom:1px solid #dce5ea!important}
  .driveway-modern-features article:last-child{border-bottom:0!important}
}
</style>
'''
          if 'id="driveway-modern-hero-styles"' not in html:
              html = html.replace('</head>', css + '\n</head>', 1)

          path.write_text(html, encoding='utf-8')

          workflow = Path('.github/workflows/redesign-driveway-hero.yml')
          workflow.unlink()
      - name: Commit redesigned hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paver-sealing/driveways.html .github/workflows/redesign-driveway-hero.yml
          git commit -m "Redesign driveway sealing hero" || exit 0
          git push