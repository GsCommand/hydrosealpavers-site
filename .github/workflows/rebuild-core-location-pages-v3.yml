name: Rebuild core location pages v3

on:
  push:
    paths:
      - 'tools/rebuild-core-location-pages-v3.py'
      - '.github/workflows/rebuild-core-location-pages-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild four core location pages
        run: |
          python tools/rebuild-core-location-pages-v3.py
          git diff --check
      - name: Commit rebuilt pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-areas/jacksonville/index.html service-areas/st-johns-county/index.html service-areas/clay-county/index.html service-areas/yulee.html
          git diff --cached --check
          git commit -m "Rebuild four core location landing pages" || exit 0
          git push
