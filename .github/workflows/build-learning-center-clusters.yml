              if marker in txt and 'Gloss, satin, matte and penetrating finishes' not in txt:
                  extra='''<section><h2>Gloss, satin, matte and penetrating finishes</h2><p>Finish is not simply cosmetic. Higher film build and stronger color enhancement can make joint lines and paver color more dramatic, while natural-look penetrating systems are selected when minimal appearance change and vapor movement are priorities. Wet areas also require traction to be considered independently from gloss.</p></section><section><h2>Breathability and moisture</h2><p>“Water based” does not automatically mean breathable and “solvent based” does not automatically mean non-breathable. Vapor transmission depends on the complete formulation and film build. In humid Florida conditions, moisture behavior should be evaluated with the surface and coating history.</p></section><section><h2>Best sealer for driveway, patio and pool deck pavers</h2><p>Driveways prioritize vehicle wear, stains and joint stability. Patios often prioritize appearance and maintenance. Pool decks add wet traction, standing water, chemicals and frequent barefoot use. The correct sealer can therefore differ across surfaces on the same property.</p></section>'''
