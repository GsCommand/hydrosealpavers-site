name: Fix strip cost article header
on:
  push:
    paths:
      - '.github/fix-strip-cost-header-trigger'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix article header layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('learning-center/cost/how-much-does-it-cost-to-strip-and-reseal-pavers/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '  </style>'
          css = '''
    /* Keep this article hero in one clean centered column. */
    body.page-strip-reseal-cost .cost-hero{
      display:block!important;
      width:100%!important;
      max-width:900px!important;
      margin:0 auto 38px!important;
      text-align:center!important;
      grid-template-columns:none!important;
      grid-template-areas:none!important;
    }
    body.page-strip-reseal-cost .cost-hero__eyebrow,
    body.page-strip-reseal-cost .cost-hero h1,
    body.page-strip-reseal-cost .cost-hero__intro,
    body.page-strip-reseal-cost .cost-meta{
      display:block!important;
      width:100%!important;
      float:none!important;
      position:static!important;
    }
    body.page-strip-reseal-cost .cost-hero__eyebrow{
      max-width:none!important;
      margin:0 0 10px!important;
      text-align:center!important;
    }
    body.page-strip-reseal-cost .cost-hero h1{
      max-width:900px!important;
      margin:0 auto 18px!important;
      font-size:clamp(2.7rem,5.4vw,4.8rem)!important;
      line-height:1.02!important;
      letter-spacing:-.04em!important;
      text-align:center!important;
    }
    body.page-strip-reseal-cost .cost-hero__intro{
      max-width:760px!important;
      margin:0 auto!important;
      font-size:1.08rem!important;
      line-height:1.7!important;
      text-align:center!important;
    }
    body.page-strip-reseal-cost .cost-meta{
      max-width:none!important;
      margin:16px auto 0!important;
      text-align:center!important;
    }
    @media(max-width:650px){
      body.page-strip-reseal-cost .cost-hero h1{
        font-size:clamp(2.35rem,11vw,3.5rem)!important;
      }
    }
'''
          if 'Keep this article hero in one clean centered column.' not in s:
              if marker not in s:
                  raise SystemExit('style marker not found')
              s = s.replace(marker, css + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning-center/cost/how-much-does-it-cost-to-strip-and-reseal-pavers/index.html
          git commit -m "Fix strip and reseal cost article header" || exit 0
          git push
