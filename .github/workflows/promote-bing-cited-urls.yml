name: Promote Bing-cited URLs

on:
  push:
    branches: [main]
    paths:
      - "tools/promote-bing-cited-urls.py"
      - ".github/workflows/promote-bing-cited-urls.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Promote cited URLs
        run: python tools/promote-bing-cited-urls.py
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel.json sitemap.xml llms.txt learning-center paver-sealing tools
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Promote Bing-cited sand URL sitewide"
            git push
          fi
