name: One-time Elfsight partial cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-elfsight-partial-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicate Elfsight chatbot and loader from shared partials
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          widget_re = re.compile(r'\s*<!--\s*Elfsight[^>]*?-->\s*<div\b[^>]*class=["\'][^"\']*elfsight-app-[^"\']*["\'][^>]*>\s*</div>\s*', re.I | re.S)
          chatbot_re = re.compile(r'<div\b[^>]*class=["\'][^"\']*elfsight-app-8d93a5a4-3fe5-4e4e-a7d5-1856bb997b36[^"\']*["\'][^>]*>\s*</div>', re.I | re.S)
          loader_re = re.compile(r'\s*<script\b(?=[^>]*\bsrc\s*=\s*["\']/assets/js/third-party-loader\.js(?:\?[^"\']*)?["\'])[^>]*>\s*</script>\s*', re.I)
          legacy_re = re.compile(r'<script\b(?=[^>]*\bsrc\s*=\s*["\']https://(?:elfsightcdn\.com/platform\.js|static\.elfsight\.com/platform/platform\.js)["\'])[^>]*>\s*</script>', re.I)

          changed = []
          for path in sorted(Path('partials').glob('*.html')):
              original = path.read_text(encoding='utf-8')
              text = widget_re.sub('\n', original)
              text = loader_re.sub('\n', text)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          violations = []
          all_html = sorted(Path('.').rglob('*.html'))
          standalone = [p for p in all_html if 'partials' not in p.parts]
          for path in standalone:
              text = path.read_text(encoding='utf-8')
              if legacy_re.search(text):
                  violations.append(f'{path}: legacy external Elfsight script remains')
              if 'elfsight-app-' in text:
                  count = len(loader_re.findall(text))
                  if count != 1:
                      violations.append(f'{path}: expected exactly 1 shared loader, found {count}')

          for path in sorted(Path('partials').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              if chatbot_re.search(text):
                  violations.append(f'{path}: duplicate chatbot DOM remains in shared partial')
              if loader_re.search(text):
                  violations.append(f'{path}: Elfsight loader remains in shared partial')
              if legacy_re.search(text):
                  violations.append(f'{path}: legacy external Elfsight script remains in shared partial')

          print(f'Standalone HTML pages verified: {len(standalone)}')
          print(f'Partials cleaned: {len(changed)}')
          for item in changed:
              print(' cleaned:', item)

          if violations:
              print('VIOLATIONS:')
              for item in violations:
                  print(' -', item)
              raise SystemExit(1)
          PY

      - name: Commit partial cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add partials
          if git diff --cached --quiet; then
            echo "No partial changes needed."
            exit 0
          fi
          git commit -m "Remove duplicate Elfsight widgets from shared partials"
          git push
