name: Strengthen must-index hubs

on:
  push:
    branches:
      - seo/must-index-service-strengthening

permissions:
  contents: write

jobs:
  strengthen:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/must-index-service-strengthening
          fetch-depth: 0
      - run: python tools/strengthen-must-index-hubs.py
      - shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "HydroSeal Site Automation"
          git config user.email "site-automation@users.noreply.github.com"
          git add service-areas/jacksonville/index.html service-areas/st-johns-county/index.html service-areas/clay-county/index.html sitemap.xml
          git commit -m "Strengthen must-index service area hubs"
          git push origin HEAD:seo/must-index-service-strengthening
