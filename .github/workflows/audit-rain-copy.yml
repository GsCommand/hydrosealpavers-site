name: Audit rain and cure copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-rain-copy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan all site copy for rain and time guidance
        shell: python
        run: |
          from pathlib import Path
          import re

          exts={'.html','.txt','.md','.js','.json','.xml'}
          files=[p for p in Path('.').rglob('*') if p.is_file() and p.suffix.lower() in exts and '.git' not in p.parts]
          exact_time=re.compile(r'(?i)(?:\b(?:4|four)\s*[-–— ]?\s*hours?\b|\b(?:60|75|90|120)\s*[-–— ]?\s*minutes?\b|\b1\s*[–-]\s*2\s*hours?\b)')
          rain_time=re.compile(r'(?is)(rain.{0,220}?(?:hour|minute|cure|window|resistan|dry)|(?:hour|minute|cure|window|resistan|dry).{0,220}?rain)')
          trident=re.compile(r'(?i)(trident|cat\s*5|hurricane|breakwall)')

          print('=== EXACT TIME REFERENCES ===')
          for p in files:
            t=p.read_text(encoding='utf-8',errors='ignore')
            for m in exact_time.finditer(t):
              s=max(0,m.start()-180); e=min(len(t),m.end()+260)
              print(f'FILE: {p}')
              print(re.sub(r'\s+',' ',t[s:e]))
              print('---')

          print('=== RAIN + TIME/WINDOW REFERENCES ===')
          for p in files:
            t=p.read_text(encoding='utf-8',errors='ignore')
            seen=set()
            for m in rain_time.finditer(t):
              s=max(0,m.start()-120); e=min(len(t),m.end()+180)
              snippet=re.sub(r'\s+',' ',t[s:e])
              if snippet in seen: continue
              seen.add(snippet)
              print(f'FILE: {p}')
              print(snippet)
              print('---')

          print('=== TRIDENT PRODUCT REFERENCES ===')
          for p in files:
            t=p.read_text(encoding='utf-8',errors='ignore')
            if trident.search(t):
              print(p)
