name: One-time Elfsight normalization

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-elfsight-normalize.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize Elfsight loading across every HTML file
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          legacy_re = re.compile(
              r'<script\b(?=[^>]*\bsrc\s*=\s*["\']https://(?:elfsightcdn\.com/platform\.js|static\.elfsight\.com/platform/platform\.js)["\'])[^>]*>\s*</script>',
              re.I,
          )
          shared_re = re.compile(
              r'<script\b(?=[^>]*\bsrc\s*=\s*["\']/assets/js/third-party-loader\.js(?:\?[^"\']*)?["\'])[^>]*>\s*</script>',
              re.I,
          )
          canonical = '<script defer src="/assets/js/third-party-loader.js"></script>'

          html_files = sorted(Path('.').rglob('*.html'))
          files_changed = 0
          legacy_removed = 0
          widget_files = 0
          shared_deduped = 0

          for path in html_files:
              original = path.read_text(encoding='utf-8')
              text = original

              legacy_count = len(legacy_re.findall(text))
              if legacy_count:
                  legacy_removed += legacy_count
                  text = legacy_re.sub('', text)

              has_widget = 'elfsight-app-' in text
              shared_count = len(shared_re.findall(text))

              if has_widget:
                  widget_files += 1
                  if shared_count > 1:
                      shared_deduped += shared_count - 1
                  text = shared_re.sub('', text)

                  body_close = re.search(r'</body\s*>', text, re.I)
                  insertion = '\n' + canonical + '\n'
                  if body_close:
                      text = text[:body_close.start()] + insertion + text[body_close.start():]
                  else:
                      text = text.rstrip() + insertion

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  files_changed += 1

          violations = []
          for path in html_files:
              text = path.read_text(encoding='utf-8')
              if legacy_re.search(text):
                  violations.append(f'{path}: legacy platform tag remains')
              if 'elfsight-app-' in text:
                  count = len(shared_re.findall(text))
                  if count != 1:
                      violations.append(f'{path}: expected 1 shared loader, found {count}')

          print(f'HTML files scanned: {len(html_files)}')
          print(f'HTML files changed: {files_changed}')
          print(f'Widget-bearing HTML files: {widget_files}')
          print(f'Legacy Elfsight platform tags removed: {legacy_removed}')
          print(f'Duplicate shared loader tags removed: {shared_deduped}')

          if violations:
              print('VIOLATIONS:')
              for item in violations:
                  print(' -', item)
              raise SystemExit(1)
          PY

      - name: Show changed files
        shell: bash
        run: |
          git status --short
          git diff --stat

      - name: Commit normalized Elfsight sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No HTML changes needed."
            exit 0
          fi
          git commit -m "Normalize Elfsight loader across HTML pages"
          git push
