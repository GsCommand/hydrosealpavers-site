name: Inject patio recent projects
on:
  push:
    paths:
      - '.github/patio-recent-projects-trigger'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Insert Elfsight recent projects between patio sections
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('paver-sealing/patios-walkways.html')
          s = p.read_text()
          marker = '    <section id="patio-process" style="margin-top:18px;" class="section">'
          widget = '''    <section class="section patio-recent-projects" style="padding-top:24px;padding-bottom:24px;">
      <div class="container">
        <script src="https://elfsightcdn.com/platform.js" async></script>
        <div class="elfsight-app-bfab489f-7fca-4f05-ba5a-d92616b76b26" data-elfsight-app-lazy></div>
      </div>
    </section>

'''
          if 'elfsight-app-bfab489f-7fca-4f05-ba5a-d92616b76b26' in s:
              raise SystemExit('widget already present')
          if marker not in s:
              raise SystemExit('process section marker not found')
          s = s.replace(marker, widget + marker, 1)
          p.write_text(s)
          PY
      - name: Commit change and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paver-sealing/patios-walkways.html
          git commit -m "Add recent projects gallery to patios page" || true
          git push
