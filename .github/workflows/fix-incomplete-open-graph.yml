name: Fix incomplete Open Graph tags
on:
  push:
    paths:
      - '.github/workflows/fix-incomplete-open-graph.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add missing Open Graph images
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          image = 'https://hydrosealpavers.com/assets/hero/paversealing-jacksonville.webp'
          alt = 'HydroSeal paver sealing and restoration in Northeast Florida'
          changed = []

          for p in Path('.').rglob('*.html'):
              s = p.read_text(encoding='utf-8')
              # Only touch pages that already use Open Graph markup.
              if 'property="og:title"' not in s or 'property="og:url"' not in s:
                  continue
              if 'property="og:image"' in s:
                  continue

              tags = (
                  f'<meta property="og:image" content="{image}">\n'
                  f'<meta property="og:image:alt" content="{alt}">\n'
              )

              # Prefer placing the image tags immediately after og:url.
              pattern = r'(<meta\s+property="og:url"\s+content="[^"]+"\s*/?>)'
              if re.search(pattern, s, flags=re.I):
                  s = re.sub(pattern, r'\1\n' + tags.rstrip(), s, count=1, flags=re.I)
              elif '</head>' in s:
                  s = s.replace('</head>', tags + '</head>', 1)
              else:
                  continue

              p.write_text(s, encoding='utf-8')
              changed.append(str(p))

          print(f'Updated {len(changed)} HTML files')
          for name in changed:
              print(name)
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html' || true
          git commit -m "Complete Open Graph tags sitewide" || exit 0
          git push
