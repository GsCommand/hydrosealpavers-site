name: Insert sand color container
on:
  push:
    paths:
      - '.github/workflows/insert-sand-color-container.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Insert sand color options container
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('learning-center/surfaces/what-is-the-best-sand-for-paver-joints-in-florida/index.html')
          s = p.read_text(encoding='utf-8')

          marker = '<section><h2>Seven factors that matter more than the product name</h2>'
          if marker not in s:
              raise SystemExit('target heading not found')

          block = '''<section class="sand-color-options" aria-labelledby="sand-color-options-title"><style>.sand-color-options{margin:30px 0;padding:clamp(24px,4vw,38px);border:1px solid #dce3e9;border-radius:22px;background:#fff}.sand-color-options h2{margin:0 0 14px;color:#0b2d4a}.sand-color-options>p{color:#536475;line-height:1.72}.sand-color-grid{margin-top:18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.sand-color-card{border:1px solid rgba(0,0,0,.09);border-radius:16px;padding:10px 10px 14px;background:#fff;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;box-shadow:0 8px 22px rgba(11,45,74,.08)}.sand-color-card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;border:1px solid rgba(0,0,0,.12);display:block}.sand-color-card strong{font-weight:900;font-size:18px;color:#0b2d4a}.sand-color-card p{margin:0;font-size:13px;line-height:1.45;color:#536475}@media(max-width:800px){.sand-color-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.sand-color-grid{grid-template-columns:1fr}}</style><h2 id="sand-color-options-title">Paver Sand Color Options</h2><p>Sand color changes the appearance of every joint line. A close match can create a softer, blended finish while a contrasting sand makes the paver pattern and borders more pronounced. HydroSeal offers multiple joint-sand colors so the finished surface can complement the paver tone, home exterior and desired level of contrast.</p><p>Color should be selected after considering the pavers when they are clean and the way the sealer may change their finished appearance. If you are unsure, send a clear photo of the surface and we can recommend a starting point.</p><div class="sand-color-grid"><div class="sand-color-card"><img src="/assets/hero/joint-sand-pearl.webp" alt="Pearl paver joint sand color sample" loading="lazy" width="800" height="800"><strong>Pearl</strong><p>A light, clean option for pale pavers and light natural-stone palettes where low contrast is preferred.</p></div><div class="sand-color-card"><img src="/assets/hero/joint-sand-tan.jpeg" alt="Tan paver joint sand color sample" loading="lazy" width="800" height="800"><strong>Tan</strong><p>A warm traditional tone that pairs naturally with beige, cream, red-brown and earth-tone pavers.</p></div><div class="sand-color-card"><img src="/assets/hero/joint-sand-fieldstone.jpeg" alt="Fieldstone paver joint sand color sample" loading="lazy" width="800" height="800"><strong>Fieldstone</strong><p>A versatile neutral for mixed-color pavers where subtle variation helps the joints blend into the field.</p></div><div class="sand-color-card"><img src="/assets/hero/joint-sand-gray.jpeg" alt="Gray paver joint sand color sample" loading="lazy" width="800" height="800"><strong>Gray</strong><p>A balanced cooler tone for gray pavers, modern homes and surfaces where a neutral joint line is preferred.</p></div><div class="sand-color-card"><img src="/assets/hero/joint-sand-platinum.jpeg" alt="Platinum paver joint sand color sample" loading="lazy" width="800" height="800"><strong>Platinum</strong><p>A brighter cool-neutral option for silver, coastal and contemporary paver color palettes.</p></div><div class="sand-color-card"><img src="/assets/hero/joint-sand-black.jpeg" alt="Black paver joint sand color sample" loading="lazy" width="800" height="800"><strong>Black</strong><p>A high-contrast choice that emphasizes paver patterns and borders, especially against lighter surfaces.</p></div></div></section>\n'''

          if 'id="sand-color-options-title"' not in s:
              s = s.replace(marker, block + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit page update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning-center/surfaces/what-is-the-best-sand-for-paver-joints-in-florida/index.html
          git commit -m "Add sand color options to joint sand guide" || exit 0
          git push
