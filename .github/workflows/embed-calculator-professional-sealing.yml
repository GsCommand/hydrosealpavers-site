name: Embed calculator in professional sealing guide
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert calculator above FAQ
        run: |
          python - <<'PY'
          from pathlib import Path
          source_path = Path('paver-sealing-cost-calculator/index.html')
          target_path = Path('learning-center/sealing/what-should-professional-paver-sealing-include/index.html')
          source = source_path.read_text(encoding='utf-8')
          target = target_path.read_text(encoding='utf-8')
          marker = '<h2>Frequently asked questions</h2>'
          if marker not in target:
              raise SystemExit('FAQ heading not found')
          if 'id="hs-embedded-calculator-script"' in target:
              raise SystemExit('Calculator already embedded')
          lines = source.splitlines()
          calc_css = lines[11].strip() + '\n' + lines[14].strip()
          card_start = source.index('<div class="calc-card" id="calculator">')
          card_end = source.index('<p class="calc-disclaimer">', card_start)
          card = source[card_start:card_end].strip()
          js_start = source.index("(function(){const root=document.getElementById('calculator')")
          js_end = source.index('})();', js_start) + 5
          calc_js = source[js_start:js_end]
          block = (
              '<!-- HydroSeal Embedded Paver Sealing Calculator -->\n'
              '<style id="hs-embedded-calculator-style">\n'
              '.hs-embedded-calculator{margin:36px 0 42px}.hs-embedded-calculator .calc-card{width:100%}\n'
              + calc_css + '\n</style>\n'
              '<div class="hs-embedded-calculator">\n' + card + '\n</div>\n'
              '<script id="hs-embedded-calculator-script">\n' + calc_js + '\n</script>\n'
          )
          target = target.replace(marker, block + marker, 1)
          target_path.write_text(target, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning-center/sealing/what-should-professional-paver-sealing-include/index.html
          git diff --cached --quiet || git commit -m "Embed paver sealing calculator in professional sealing guide"
          git push
