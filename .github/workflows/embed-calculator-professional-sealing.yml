name: Embed calculator in professional sealing guide
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert calculator above FAQ
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('learning-center/sealing/what-should-professional-paver-sealing-include/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<h2>Frequently asked questions</h2>'
          block = base64.b64decode('...18980 chars truncated...')}').decode('utf-8')
          if marker not in s:
              raise SystemExit('FAQ heading not found')
          if 'id="hs-embedded-calculator-script"' not in s:
              s = s.replace(marker, block + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning-center/sealing/what-should-professional-paver-sealing-include/index.html
          git diff --cached --quiet || git commit -m "Embed paver sealing calculator in professional sealing guide"
          git push
