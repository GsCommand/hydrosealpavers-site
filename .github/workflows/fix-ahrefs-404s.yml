name: Fix Ahrefs 404 URLs
on:
  push:
    paths:
      - '.github/workflows/fix-ahrefs-404s.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix stale sitemap URLs and broken internal links
        run: |
          sed -i '/<loc>https:\/\/hydrosealpavers.com\/gallery<\/loc>/d' sitemap.xml
          sed -i '/<loc>https:\/\/hydrosealpavers.com\/pressure-washing<\/loc>/d' sitemap.xml
          sed -i 's|/learning-center/surfaces/how-much-does-it-cost-to-strip-and-reseal-pavers|/learning-center/cost/how-much-does-it-cost-to-strip-and-reseal-pavers|g' learning-center/problems/cleaning-resealing-or-stripping/index.html
          sed -i 's|href="/contact"|href="/get-a-quote"|g' learning-center/problems/cleaning-resealing-or-stripping/index.html
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml learning-center/problems/cleaning-resealing-or-stripping/index.html
          git commit -m "Fix four Ahrefs 404 sources" || exit 0
          git push
