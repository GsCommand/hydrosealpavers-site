name: Embed travertine before-after image
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Embed uploaded travertine image directly in article
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('learning-center/travertine/how-to-clean-travertine-without-damage/index.html')
          s = p.read_text(encoding='utf-8')
          if 'hs-travertine-cleaning-photo' in s:
              raise SystemExit(0)
          marker = '<section><h2>7-step travertine cleaning process</h2>'
          if marker not in s:
              raise SystemExit('target heading not found')
          b64 = ''''''
          figure = '<figure class="hs-travertine-cleaning-photo" style="margin:28px 0 30px"><img src="data:image/webp;base64,' + b64 + '" alt="Before and after travertine cleaning project" width="531" height="305" loading="lazy" style="display:block;width:100%;height:auto;border-radius:18px"></figure>'
          p.write_text(s.replace(marker, figure + marker, 1), encoding='utf-8')
          PY
      - name: Commit article update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning-center/travertine/how-to-clean-travertine-without-damage/index.html
          git commit -m "Embed travertine before-after image in article"
          git push
