name: Fix strip cost header source
on:
  push:
    paths:
      - '.github/workflows/fix-strip-cost-header-source.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix article header layout in source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('learning-center/cost/how-much-does-it-cost-to-strip-and-reseal-pavers/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '    .cost-meta{margin:15px 0 0;color:#718291;font-size:.9rem;line-height:1.6}\n'
          fix = '''    .page-strip-reseal-cost .cost-hero{display:block!important;width:100%!important;max-width:900px!important;margin:0 auto 38px!important;text-align:center!important;grid-template-columns:none!important;grid-template-areas:none!important}\n    .page-strip-reseal-cost .cost-hero__eyebrow,.page-strip-reseal-cost .cost-hero h1,.page-strip-reseal-cost .cost-hero__intro,.page-strip-reseal-cost .cost-meta{display:block!important;width:100%!important;max-width:none;float:none!important;position:static!important;grid-column:auto!important;grid-row:auto!important}\n    .page-strip-reseal-cost .cost-hero__eyebrow{margin:0 0 10px!important;text-align:center!important}\n    .page-strip-reseal-cost .cost-hero h1{max-width:900px!important;margin:0 auto 18px!important;font-size:clamp(2.7rem,5.4vw,4.8rem)!important;line-height:1.02!important;letter-spacing:-.04em!important;text-align:center!important}\n    .page-strip-reseal-cost .cost-hero__intro{max-width:760px!important;margin:0 auto!important;font-size:1.08rem!important;line-height:1.7!important;text-align:center!important}\n    .page-strip-reseal-cost .cost-meta{margin:16px auto 0!important;text-align:center!important}\n'''
          if '.page-strip-reseal-cost .cost-hero{display:block!important' not in s:
              if marker not in s:
                  raise SystemExit('CSS insertion marker not found')
              s = s.replace(marker, marker + fix, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning-center/cost/how-much-does-it-cost-to-strip-and-reseal-pavers/index.html
          git commit -m "Fix strip and reseal cost article header source" || exit 0
          git push
