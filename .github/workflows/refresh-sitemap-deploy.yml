name: Refresh sitemap deployment
on:
  push:
    paths:
      - '.github/workflows/refresh-sitemap-deploy.yml'

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refresh sitemap file
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sitemap.xml')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- refreshed 2026-08-13 to clear stale 4xx sitemap entries -->\n'
          if marker not in s:
              s = s.replace('<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n', '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Refresh sitemap deployment" || exit 0
          git push
