name: Update Sitewide Nav 4x4
on:
  push:
    branches: [agent/sitewide-nav-4x4]
    paths:
      - tools/update-sitewide-nav.py
      - .github/workflows/update-sitewide-nav.yml
permissions:
  contents: write
jobs:
  update-nav:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update and audit every HTML header
        run: python tools/update-sitewide-nav.py
      - name: Verify exact 4+4 menu and full coverage
        run: python tools/update-sitewide-nav.py --check
      - name: Commit sitewide header updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' '**/*.html'
          git diff --cached --quiet || git commit -m "Add cleaning and repair to sitewide navigation"
          git push
