name: Fix core location links

on:
  push:
    paths:
      - 'tools/fix-core-location-links.py'
      - 'tools/unwrap-retired-location-links.py'
      - '.github/workflows/fix-core-location-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild service-area internal links
        run: |
          python tools/fix-core-location-links.py
          python tools/unwrap-retired-location-links.py
          find service-areas -type f -name '*.html' -print0 | xargs -0 sed -i 's/[[:space:]]\+$//'
          sed -i 's/[[:space:]]\+$//' sitemap.html partials/header.html partials/footer.html

      - name: Commit link architecture cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-areas sitemap.html partials/header.html partials/footer.html
          git diff --cached --check
          git commit -m "Finish core service area link cleanup" || exit 0
          git push
