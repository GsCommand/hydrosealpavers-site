name: Fix core location links

on:
  push:
    paths:
      - 'tools/unwrap-retired-location-links.py'
      - '.github/workflows/fix-core-location-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove misleading retired-location anchors
        run: |
          python tools/unwrap-retired-location-links.py
          find service-areas -type f -name '*.html' -print0 | xargs -0 sed -i 's/[[:space:]]\+$//'

      - name: Commit final link cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-areas
          git diff --cached --check
          git commit -m "Remove retired location anchor text" || exit 0
          git push
