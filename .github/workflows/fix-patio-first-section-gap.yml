name: Fix patio first section gap
on:
  push:
    paths:
      - '.github/patio-gap-trigger'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Increase gap below patio price bar
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('paver-sealing/patios-walkways.html')
          s = p.read_text()
          old = '<section class="section" style="padding-top:6px;">'
          new = '<section class="section" style="padding-top:72px;">'
          if old not in s:
              raise SystemExit('target section not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paver-sealing/patios-walkways.html
          git commit -m "Increase space below patio price bar" || exit 0
          git push
