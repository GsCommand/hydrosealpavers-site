name: Install approved homepage

on:
  push:
    paths:
      - "hydroseal-new-homepage-production.zip"
      - ".github/workflows/install-homepage.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install homepage package
        shell: bash
        run: |
          set -euo pipefail
          test -f hydroseal-new-homepage-production.zip
          rm -rf .homepage-install
          mkdir .homepage-install
          unzip -o hydroseal-new-homepage-production.zip -d .homepage-install
          test -f .homepage-install/index.html
          test -f .homepage-install/assets/css/home-redesign.css
          test -f .homepage-install/assets/js/home-redesign.js
          cp .homepage-install/index.html index.html
          mkdir -p assets/css assets/js
          cp .homepage-install/assets/css/home-redesign.css assets/css/home-redesign.css
          cp .homepage-install/assets/js/home-redesign.js assets/js/home-redesign.js
          rm -rf .homepage-install hydroseal-new-homepage-production.zip

      - name: Commit installed homepage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/css/home-redesign.css assets/js/home-redesign.js hydroseal-new-homepage-production.zip
          if git diff --cached --quiet; then
            echo "No homepage changes to commit."
            exit 0
          fi
          git commit -m "Replace homepage with approved redesign"
          git push
