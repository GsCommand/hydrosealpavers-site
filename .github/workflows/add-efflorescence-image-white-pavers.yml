name: Add efflorescence image to white pavers article
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert image above Northeast Florida section
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('learning-center/problems/why-are-my-pavers-turning-white-in-florida/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<section><h2>Why this is common in Northeast Florida</h2>'
          image = '<figure class="hs-efflorescence-photo" style="display:block!important;margin:28px 0 30px!important"><img src="/assets/hero/jacksonville-paver-sealing-efflorescence.jpeg" alt="Efflorescence and white mineral deposits on Jacksonville pavers" loading="lazy" style="display:block!important;width:100%!important;height:auto!important;border-radius:18px!important"></figure>\n'
          if marker not in s:
              raise SystemExit('Target heading not found')
          if '/assets/hero/jacksonville-paver-sealing-efflorescence.jpeg' in s:
              raise SystemExit('Image already present')
          s = s.replace(marker, image + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning-center/problems/why-are-my-pavers-turning-white-in-florida/index.html
          git diff --cached --quiet || git commit -m "Add efflorescence image to white pavers article"
          git push
