name: One-off sand CTA fix

on:
  push:
    paths:
      - '.github/workflows/one-off-sand-cta-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'Add one-off sand CTA fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace bottom CTA group
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('paver-sealing/sand-options.html')
          text = path.read_text()
          old = '<div class="sand-bottom-cta-row"><a class="btn btn-primary" href="/get-a-quote">Request a Quote</a><a class="btn btn-ghost" href="tel:+19045375000">Call 904.537.5000</a><a class="btn btn-ghost" href="/paver-sealing/driveways">Driveway Paver Sealing</a></div>'
          new = '<div class="sand-bottom-cta-row"><a class="btn btn-primary" href="/get-a-quote">Request a Quote</a></div>'
          if old not in text:
              raise SystemExit('Expected CTA block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paver-sealing/sand-options.html
          git commit -m "Simplify sand page bottom CTA" || exit 0
          git push
