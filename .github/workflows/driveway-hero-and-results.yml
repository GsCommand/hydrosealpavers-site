name: Update driveway hero and results
on:
  push:
    paths:
      - '.github/workflows/driveway-hero-and-results.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redesign driveway hero and add results layout
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('paver-sealing/driveways.html')
          html = path.read_text(encoding='utf-8')

          # Keep the new transparent header, but move trust/breadcrumb content below the hero.
          prehero = re.search(r'\s*<!-- TRUST BAR \(global\) -->.*?<main id="page" data-page>\s*', html, re.S)
          if not prehero:
              raise SystemExit('Could not locate pre-hero content')
          below_hero = prehero.group(0).replace('<main id="page" data-page>', '').strip()
          html = html[:prehero.start()] + '\n<main id="page" data-page>\n' + html[prehero.end():]

          old_hero = re.compile(r'\s*<!-- HERO -->\s*<section class="hero2".*?</section>\s*', re.S)
          hero = '''
<!-- DRIVEWAY HERO -->
<section class="driveway-home-hero">
  <img class="driveway-home-hero__bg" src="/assets/hero/hydroseal-driveway.webp" width="1920" height="1080" alt="Professionally restored and sealed paver driveway in Jacksonville" loading="eager" decoding="async" fetchpriority="high" />
  <div class="driveway-home-hero__grid hs-modern-shell">
    <div class="driveway-home-hero__glass">
      <span class="driveway-home-hero__eyebrow">DRIVEWAY PAVER SEALING IN NORTHEAST FLORIDA</span>
      <h1>Driveway Paver Sealing Jacksonville &amp; St. Johns County</h1>
      <h2>Cleaned. Resanded. Sealed. Built for Florida Driveways.</h2>
      <p>Professional driveway restoration with deep cleaning, ASTM C144 joint sand, breathable sealer, and careful preparation across Jacksonville, St. Johns County, and Clay County.</p>
      <div class="driveway-home-hero__actions">
        <a class="driveway-home-hero__primary" href="/get-a-quote">Request a Quote</a>
        <a class="driveway-home-hero__secondary" href="/paver-sealing-cost-calculator">Try Instant Pricing</a>
      </div>
    </div>
    <div class="driveway-home-hero__proof">
      <article class="driveway-home-review">
        <div class="driveway-home-google">Google</div>
        <div class="driveway-home-stars" aria-label="Five-star rating">★★★★★</div>
        <h3>5-STAR RATED DRIVEWAY RESTORATION.</h3>
        <p>Homeowners choose HydroSeal when faded driveway pavers need more than a quick pressure wash.</p>
        <a href="https://share.google/4ddHhmrSn3woAYR6h" target="_blank" rel="noopener noreferrer">Read customer reviews →</a>
      </article>
      <div class="driveway-home-certified">TRIDENT MASTER CERTIFIED</div>
    </div>
  </div>
</section>
<section class="driveway-home-features hs-modern-shell" aria-label="Driveway restoration standards">
  <article><h3>DEEP CLEANING</h3><p>Surface preparation before sealing.</p></article>
  <article><h3>JOINT SAND</h3><p>ASTM C144 kiln-dried sand.</p></article>
  <article><h3>BREATHABLE SEALER</h3><p>Two controlled coats for Florida.</p></article>
  <article><h3>2-YEAR WARRANTY</h3><p>Covered workmanship and adhesion.</p></article>
</section>
'''
          html, count = old_hero.subn('\n' + hero + '\n' + below_hero + '\n', html, count=1)
          if count != 1:
              raise SystemExit(f'Expected one old hero, replaced {count}')

          # Add the two supplied before/after projects after the introductory copy.
          marker = '<section style="margin-top:18px;">\n        <div class="card">\n          <h2 style="margin:0 0 6px;">Driveway Sealing in Jacksonville, FL</h2>'
          results = '''
<section class="driveway-results-showcase" aria-labelledby="driveway-results-title">
  <div class="driveway-results-head">
    <span>REAL HYDROSEAL DRIVEWAY RESULTS</span>
    <h2 id="driveway-results-title">From Faded and Worn to Clean, Protected, and Finished.</h2>
    <p>Two Northeast Florida driveway restorations showing what proper cleaning, joint preparation, fresh sand, and controlled sealer application can accomplish.</p>
  </div>
  <div class="driveway-results-grid">
    <figure class="driveway-result-card driveway-result-card--wide">
      <img src="/assets/hero/driveway-before-after-hydroseal.webp" width="1448" height="1086" alt="Before and after driveway paver sealing and color restoration by HydroSeal" loading="lazy" decoding="async" />
      <figcaption><strong>Driveway Color Restoration</strong><span>Deep cleaning, fresh joint sand, and protective sealing.</span></figcaption>
    </figure>
    <figure class="driveway-result-card driveway-result-card--tall">
      <img src="/assets/hero/ponte-vedra-driveway-before-after.webp" width="800" height="956" alt="Before and after Ponte Vedra driveway paver cleaning and sealing" loading="lazy" decoding="async" />
      <figcaption><strong>Ponte Vedra Driveway Restoration</strong><span>Cleaned and sealed for a richer, more uniform finish.</span></figcaption>
    </figure>
  </div>
</section>
'''
          if marker not in html:
              raise SystemExit('Driveway content insertion point not found')
          html = html.replace(marker, results + '\n' + marker, 1)

          css = '''
<style id="driveway-home-redesign-styles">
.driveway-home-hero{position:relative;min-height:720px;overflow:hidden;background:#0b2d4a;color:#fff;padding:132px 0 90px;font-family:Arial,Helvetica,sans-serif}
.driveway-home-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,25,39,.12),rgba(4,25,39,.01) 60%,rgba(4,25,39,.08));pointer-events:none}
.driveway-home-hero__bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.driveway-home-hero__grid{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1.28fr) minmax(280px,.62fr);gap:30px;align-items:center}
.driveway-home-hero__glass{padding:36px 38px;border:1px solid rgba(255,255,255,.3);border-radius:30px;background:rgba(5,32,51,.18);box-shadow:0 24px 70px rgba(0,0,0,.2);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.driveway-home-hero__eyebrow{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(255,255,255,.08);font-size:11px;font-weight:900;letter-spacing:1.5px}
.driveway-home-hero__eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:#39bfea;box-shadow:0 0 16px #39bfea}
.driveway-home-hero h1{max-width:780px;margin:24px 0 12px;color:#fff;font-size:clamp(40px,5.2vw,72px);line-height:.95;letter-spacing:-2.8px;text-transform:uppercase;text-shadow:0 14px 38px rgba(0,0,0,.34)}
.driveway-home-hero h2{margin:0;color:#9be6fa;font-size:clamp(17px,2vw,24px);line-height:1.2;text-transform:uppercase}
.driveway-home-hero__glass p{max-width:720px;margin:18px 0 0;color:rgba(255,255,255,.94);font-size:16px;line-height:1.65}
.driveway-home-hero__actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.driveway-home-hero__primary,.driveway-home-hero__secondary{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 23px;border-radius:999px;text-decoration:none;text-transform:uppercase;font-size:13px;font-weight:950;letter-spacing:.8px}
.driveway-home-hero__primary{background:#39bfea;color:#fff;box-shadow:0 12px 30px rgba(57,191,234,.34)}
.driveway-home-hero__secondary{background:#fff;color:#0b2d4a}
.driveway-home-hero__proof{display:flex;flex-direction:column;gap:12px}
.driveway-home-review{padding:28px;border-radius:24px;background:rgba(255,255,255,.95);color:#0b1220;box-shadow:0 22px 60px rgba(0,0,0,.2)}
.driveway-home-google{display:inline-flex;padding:6px 10px;border:1px solid #e5e7eb;border-radius:999px;background:#fff;color:#44505e;font-size:12px;font-weight:800}
.driveway-home-stars{margin-top:10px;color:#f8b400;letter-spacing:2px}
.driveway-home-review h3{margin:15px 0 10px;color:#071329;font-size:25px;line-height:.95;letter-spacing:-.8px}
.driveway-home-review p{margin:0;color:#44505e;font-size:14px;line-height:1.55}
.driveway-home-review a{display:inline-block;margin-top:18px;color:#071329;text-decoration:none;text-transform:uppercase;font-size:11px;font-weight:900;letter-spacing:1px}
.driveway-home-certified{display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:999px;background:#0f6ea8;color:#fff;font-size:13px;font-weight:950;text-align:center;box-shadow:0 14px 34px rgba(15,110,168,.28)}
.driveway-home-features{position:relative;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);margin-top:-34px;background:#fff;border:10px solid #fff;border-radius:22px;box-shadow:0 18px 48px rgba(11,45,74,.14);overflow:hidden}
.driveway-home-features article{padding:18px 20px;border-right:1px solid #dce5ea}
.driveway-home-features article:last-child{border-right:0}
.driveway-home-features h3{margin:0;color:#082f4f;font-size:16px;line-height:1}
.driveway-home-features p{margin:6px 0 0;color:#647383;font-size:12px;line-height:1.35}
.driveway-results-showcase{margin:34px 0 22px;padding:clamp(24px,4vw,42px);border-radius:28px;background:#eef3f5}
.driveway-results-head{max-width:860px;margin-bottom:24px}
.driveway-results-head span{color:#0f6ea8;font-size:12px;font-weight:950;letter-spacing:1.5px}
.driveway-results-head h2{margin:9px 0 10px;color:#082f4f;font-size:clamp(32px,4vw,54px);line-height:.98;letter-spacing:-1.8px;text-transform:uppercase}
.driveway-results-head p{margin:0;color:#536475;line-height:1.65}
.driveway-results-grid{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(280px,.82fr);gap:20px;align-items:stretch}
.driveway-result-card{position:relative;margin:0;overflow:hidden;border-radius:22px;background:#0b2d4a;box-shadow:0 18px 44px rgba(11,45,74,.14)}
.driveway-result-card img{display:block;width:100%;height:100%;object-fit:cover}
.driveway-result-card--wide{min-height:420px}
.driveway-result-card--tall{min-height:420px}
.driveway-result-card figcaption{position:absolute;left:0;right:0;bottom:0;padding:46px 20px 20px;background:linear-gradient(transparent,rgba(4,20,32,.88));color:#fff}
.driveway-result-card figcaption strong,.driveway-result-card figcaption span{display:block}
.driveway-result-card figcaption strong{font-size:20px}
.driveway-result-card figcaption span{margin-top:4px;font-size:13px;color:rgba(255,255,255,.82)}
@media(max-width:980px){.driveway-home-hero{min-height:auto;padding:104px 0 74px}.driveway-home-hero__grid{grid-template-columns:1fr}.driveway-home-hero__proof{display:grid;grid-template-columns:1fr 1fr}.driveway-home-certified{border-radius:24px}.driveway-home-features{grid-template-columns:repeat(2,1fr);margin-top:-24px}.driveway-home-features article:nth-child(2){border-right:0}.driveway-home-features article:nth-child(-n+2){border-bottom:1px solid #dce5ea}.driveway-results-grid{grid-template-columns:1fr}.driveway-result-card--wide,.driveway-result-card--tall{min-height:360px}}
@media(max-width:620px){.driveway-home-hero{padding:92px 0 58px}.driveway-home-hero__glass{padding:24px 20px;border-radius:22px}.driveway-home-hero h1{font-size:40px;letter-spacing:-1.7px}.driveway-home-hero__actions{display:grid}.driveway-home-hero__primary,.driveway-home-hero__secondary{width:100%}.driveway-home-hero__proof{grid-template-columns:1fr}.driveway-home-review{padding:22px}.driveway-home-features{grid-template-columns:1fr;margin-top:-16px;border-width:7px}.driveway-home-features article{border-right:0;border-bottom:1px solid #dce5ea!important}.driveway-home-features article:last-child{border-bottom:0!important}.driveway-results-showcase{padding:22px 16px;border-radius:22px}.driveway-result-card--wide,.driveway-result-card--tall{min-height:300px}}
</style>
'''
          if 'id="driveway-home-redesign-styles"' not in html:
              html = html.replace('</head>', css + '\n</head>', 1)

          path.write_text(html, encoding='utf-8')
          Path('.github/workflows/driveway-hero-and-results.yml').unlink()
      - name: Commit page redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paver-sealing/driveways.html .github/workflows/driveway-hero-and-results.yml
          git commit -m "Redesign driveway hero and add results showcase" || exit 0
          git push
