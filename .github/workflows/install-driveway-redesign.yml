name: Install driveway redesign
on:
  push:
    paths:
      - '.github/workflows/install-driveway-redesign.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write redesigned driveway page
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip
          payload = ''''''
          data = gzip.decompress(base64.b64decode(payload))
          Path('paver-sealing/driveways.html').write_bytes(data)
          Path('.github/workflows/install-driveway-redesign.yml').unlink()
      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paver-sealing/driveways.html .github/workflows/install-driveway-redesign.yml
          git commit -m "Redesign driveway paver sealing page" || exit 0
          git push
