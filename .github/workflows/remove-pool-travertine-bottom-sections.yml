name: Remove pool and travertine bottom sections

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-pool-travertine-bottom-sections.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove requested bottom sections
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
            Path('paver-sealing/pool-decks.html'),
            Path('paver-sealing/travertine-sealing.html'),
          ]

          def matching_section_end(text, start):
            rx = re.compile(r'<section\b[^>]*>|</section>', re.I)
            depth = 0
            for m in rx.finditer(text, start):
              if m.group(0).lower().startswith('</section'):
                depth -= 1
                if depth == 0:
                  return m.end()
              else:
                depth += 1
            raise RuntimeError('Could not balance section')

          def remove_section_with_marker(text, marker):
            pos = text.find(marker)
            if pos < 0:
              return text, False
            start = text.rfind('<section', 0, pos)
            if start < 0:
              raise RuntimeError(f'No section found for marker: {marker}')
            end = matching_section_end(text, start)
            return text[:start] + text[end:], True

          social_re = re.compile(
            r'\s*<!--\s*Elfsight Social Media Icons.*?-->\s*<div class="elfsight-app-f7229490-8c31-483c-aa82-d3a3b751a7c7 bottom-social-links"[^>]*></div>\s*',
            re.I | re.S,
          )
          social_plain_re = re.compile(
            r'\s*<div class="elfsight-app-f7229490-8c31-483c-aa82-d3a3b751a7c7 bottom-social-links"[^>]*></div>\s*',
            re.I,
          )

          changed = []
          for path in files:
            text = path.read_text(encoding='utf-8')
            original = text

            if path.name == 'pool-decks.html':
              text, _ = remove_section_with_marker(text, 'No Shortcuts. No Mystery Pricing. Just A Clean, Protected Pool Deck.')

            # Remove this final quote CTA wherever it appears on either requested page.
            text, _ = remove_section_with_marker(text, 'READY TO BRING IT BACK?')
            text, _ = remove_section_with_marker(text, 'Ready to bring it back?')

            text = social_re.sub('\n', text)
            text = social_plain_re.sub('\n', text)

            if text != original:
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          # Validate the requested content is gone from both pages.
          errors = []
          for path in files:
            text = path.read_text(encoding='utf-8')
            if 'elfsight-app-f7229490-8c31-483c-aa82-d3a3b751a7c7 bottom-social-links' in text:
              errors.append(f'{path}: social icons still present')
            if 'READY TO BRING IT BACK?' in text or 'Ready to bring it back?' in text:
              errors.append(f'{path}: bottom quote CTA still present')
          pool = files[0].read_text(encoding='utf-8')
          if 'No Shortcuts. No Mystery Pricing. Just A Clean, Protected Pool Deck.' in pool:
            errors.append('pool deck pricing CTA still present')

          print('CHANGED:', changed)
          print('ERRORS:', errors)
          if errors:
            raise SystemExit(1)

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "HydroSeal Site Automation"
          git config user.email "site-automation@users.noreply.github.com"
          git add paver-sealing/pool-decks.html paver-sealing/travertine-sealing.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Remove pool and travertine bottom CTA sections"
          git push origin HEAD:main
