name: Show travertine article image
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Learning Center image override
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/css/learning-center.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* Travertine cleaning article image override */'
          if marker not in s:
              s += '''\n\n/* Travertine cleaning article image override */\n.page-learning-center .blog-post figure.hs-travertine-cleaning-photo{display:block!important;margin:28px 0 30px!important}\n.page-learning-center .blog-post figure.hs-travertine-cleaning-photo img{display:block!important;width:100%!important;height:auto!important;border-radius:18px!important}\n'''
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/learning-center.css
          git diff --cached --quiet || git commit -m "Show travertine before-after image in Learning Center"
          git push
