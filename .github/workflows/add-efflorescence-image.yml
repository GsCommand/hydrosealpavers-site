name: Add efflorescence image
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert efflorescence image
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('learning-center/problems/what-causes-efflorescence-on-pavers/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</p></section>\n<section><h2>6 common causes of paver efflorescence</h2>'
          replacement = '</p></section>\n<figure class="hs-efflorescence-photo" style="display:block!important;margin:28px 0 30px!important"><img src="/assets/hero/jacksonville-paver-sealing-efflorescence.jpeg" alt="Efflorescence on Jacksonville pavers before treatment" loading="lazy" style="display:block!important;width:100%!important;height:auto!important;border-radius:18px!important"></figure>\n<section><h2>6 common causes of paver efflorescence</h2>'
          if marker not in s:
              raise SystemExit('Target section marker not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning-center/problems/what-causes-efflorescence-on-pavers/index.html
          git diff --cached --quiet || git commit -m "Add efflorescence photo to learning center article"
          git push
# trigger
