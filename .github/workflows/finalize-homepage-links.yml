name: Finalize homepage links

on:
  push:
    paths:
      - ".github/workflows/finalize-homepage-links.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace preview links with production routes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '#driveways/': '/paver-sealing/driveways',
              '#pool-decks/': '/paver-sealing/pool-decks',
              '#travertine/': '/paver-sealing/travertine-sealing',
              '#resealing/': '/care-program',
              '#calculator/': '/paver-sealing-cost-calculator',
              '#strip-reseal/': '/paver-resealing',
              '#sand-options/': '/paver-sealing/sand-options',
              '#about/': '/about',
              '#care-program/': '/care-program',
              '#warranty/': '/warranty',
              '#faq/': '/faq',
              '#quote/': '/get-a-quote',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit route fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finalize homepage production links"
          git push
