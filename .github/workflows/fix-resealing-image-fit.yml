name: Fix resealing image fit

on:
  push:
    paths:
      - '.github/workflows/fix-resealing-image-fit.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Improve resealing image fit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('assets/js/nav.js')
          text = path.read_text()

          text = text.replace(
              '.reseal-feature-media{min-height:430px;overflow:hidden;border-radius:26px;background:#e8eef1;box-shadow:0 18px 42px rgba(11,45,74,.12)}\n        .reseal-feature-media img{display:block;width:100%;height:100%;object-fit:cover}',
              '.reseal-feature-media{min-height:0;aspect-ratio:4/3;overflow:hidden;border-radius:26px;background:#e8eef1;box-shadow:0 18px 42px rgba(11,45,74,.12);display:flex;align-items:center;justify-content:center}\n        .reseal-feature-media img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}\n        .reseal-feature-media--contain{background:#f5f7f9;padding:10px}\n        .reseal-feature-media--contain img{object-fit:contain!important;width:100%;height:100%}'
          )

          text = text.replace(
              '@media(max-width:980px){.reseal-feature-grid{grid-template-columns:1fr}.reseal-feature-media{min-height:360px}}',
              '@media(max-width:980px){.reseal-feature-grid{grid-template-columns:1fr}.reseal-feature-media{aspect-ratio:4/3}}'
          )
          text = text.replace(
              '@media(max-width:650px){.reseal-feature-shell{width:calc(100% - 24px)}.reseal-feature-section{padding:64px 0}.reseal-feature-card{padding:24px 20px}.reseal-feature-media{min-height:280px}}',
              '@media(max-width:650px){.reseal-feature-shell{width:calc(100% - 24px)}.reseal-feature-section{padding:64px 0}.reseal-feature-card{padding:24px 20px}.reseal-feature-media{aspect-ratio:4/3}.reseal-feature-media--contain{padding:6px}}'
          )

          text = text.replace(
              '<div class="reseal-feature-media"><img src="/assets/hero/driveway-before-after-hydroseal.webp"',
              '<div class="reseal-feature-media reseal-feature-media--contain"><img src="/assets/hero/driveway-before-after-hydroseal.webp"'
          )
          text = text.replace(
              '<div class="reseal-feature-media"><img src="/assets/images/driveway-before-after.webp"',
              '<div class="reseal-feature-media reseal-feature-media--contain"><img src="/assets/images/driveway-before-after.webp"'
          )

          path.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/nav.js
          git commit -m "Improve paver resealing image fit"
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          git pull --rebase
          rm .github/workflows/fix-resealing-image-fit.yml
          git add -A
          git commit -m "Remove one-time resealing image-fit workflow"
          git push
