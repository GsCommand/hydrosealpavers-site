name: Audit footer standardization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-footer-standardization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit all HTML footer implementations
        shell: python
        run: |
          from pathlib import Path
          import re

          files=sorted(Path('.').rglob('*.html'))
          shared=[]; static_site=[]; other_footer=[]; no_footer=[]; css_root=[]; css_assets=[]
          for p in files:
            if '.git' in p.parts: continue
            t=p.read_text(encoding='utf-8',errors='ignore')
            s=str(p)
            if 'data-include="/partials/footer.html"' in t or "data-include='/partials/footer.html'" in t:
              shared.append(s)
            elif re.search(r'<footer[^>]*class=["\'][^"\']*site-footer', t, re.I):
              static_site.append(s)
            elif re.search(r'<footer\b', t, re.I):
              other_footer.append(s)
            else:
              no_footer.append(s)
            if '/site-footer.css' in t: css_root.append(s)
            if '/assets/css/site-footer.css' in t: css_assets.append(s)

          print(f'TOTAL_HTML={len(files)}')
          for name,arr in [('SHARED_PARTIAL',shared),('STATIC_SITE_FOOTER',static_site),('OTHER_FOOTER',other_footer),('NO_FOOTER',no_footer),('LOADS_ROOT_SITE_FOOTER_CSS',css_root),('LOADS_ASSETS_SITE_FOOTER_CSS',css_assets)]:
            print(f'\n=== {name} ({len(arr)}) ===')
            for x in arr: print(x)

          print('\n=== FILES WITH FOOTER-RELATED INLINE STYLE OR LEGACY SELECTORS ===')
          pat=re.compile(r'(shared-footer-page|\.site-footer|\.footer-grid|\.footer-title|\.footer-links|\.footer-meta)',re.I)
          for p in files:
            t=p.read_text(encoding='utf-8',errors='ignore')
            if pat.search(t): print(p)
